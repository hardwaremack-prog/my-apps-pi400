<!doctype html>
<html lang="en"><head><script src="../suite-users.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0">
<title>Steady Bills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: app shell — sticky top bar + tabbed panels; bottom tab bar on phones. Bills are colorful icon tiles on a calm mint ground. */
:root{
  --bg:#F2F6F3; --surface:#FFFFFF; --surface-2:#E8EFEA; --ink:#15302A; --muted:#5C7169; --line:#D5E0D9;
  --accent:#FF7A33; --accent-ink:#FFFFFF; --sun:#FFC23D; --good:#1E9E68; --warn:#E39A00; --bad:#D9443A;
  --display:"Fredoka","Nunito","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px; --r-sm:12px; --shadow:0 1px 2px rgba(21,48,42,.06),0 6px 20px rgba(21,48,42,.06);
  --c-house:#4F6BED; --c-car:#E2543B; --c-card:#8B4FD8; --c-bank:#2E8B6E; --c-bolt:#E09A00; --c-flame:#F06A2A;
  --c-drop:#1E9BD7; --c-cart:#3A9E52; --c-fuel:#E0662E; --c-fork:#C2509A; --c-basket:#7666D6; --c-paw:#B07A3E; --c-kid:#D99A12; --c-ticket:#2B98C8; --c-cut:#D0567A; --c-pill:#25A396; --c-wrench:#66788C; --c-gift:#D8443A; --c-shirt:#4D74D4; --c-smoke:#8C7B6B; --c-glass:#A8457E; --c-boat:#1F7FB8; --c-badge:#5E8A3A; --c-piggy:#E07AA0; --c-tooth:#2AA3C6; --c-steth:#DD5468; --c-eye:#7A5FD6; --c-oil:#C48A12; --c-tire:#58677A; --c-brake:#CC4636; --c-battery:#3A9A58; --c-bell:#E0841B; --c-roof:#B5583A; --c-snow:#3AA0D8; --c-tank:#5C7FA3; --c-filter:#8C8E4E; --c-therm:#1FA39A; --c-window:#4FA3D1; --c-deck:#A0703C; --c-siding:#6E8B9E; --c-road:#5B6470; --c-brick:#B2543F; --c-idcard:#3C7DD9; --c-plate:#2E9E6E; --c-passport:#3A4F9A; --c-fish:#2B9AB8; --c-folder:#C9952B; --c-tv:#D2448E; --c-wifi:#22A39B; --c-phone:#5A6B7D; --c-shield:#3C9A3C; --c-transit:#2477B3; --c-other:#8A7F70;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1916; --surface:#16241F; --surface-2:#1E302A; --ink:#E6F1EC; --muted:#93A8A0; --line:#2A3E37;
  --accent:#FF8A47; --accent-ink:#1A0E05; --sun:#FFC94F; --good:#3CC487; --warn:#F2B230; --bad:#F06A60;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --c-phone:#8A9BAE; --c-other:#A99D8C; --c-house:#6F86FF; --c-card:#A673F0; --c-bank:#3FAE8B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1916; --surface:#16241F; --surface-2:#1E302A; --ink:#E6F1EC; --muted:#93A8A0; --line:#2A3E37;
  --accent:#FF8A47; --accent-ink:#1A0E05; --sun:#FFC94F; --good:#3CC487; --warn:#F2B230; --bad:#F06A60;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --c-phone:#8A9BAE; --c-other:#A99D8C; --c-house:#6F86FF; --c-card:#A673F0; --c-bank:#3FAE8B; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid color-mix(in oklab,var(--accent) 70%,transparent);outline-offset:2px;border-radius:8px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.2px}
.brand-mark{width:34px;height:34px;border-radius:11px;background:conic-gradient(from 200deg,var(--sun),var(--accent),var(--c-tv),var(--c-house),var(--c-wifi),var(--sun));display:grid;place-items:center}
.brand-mark i{width:16px;height:16px;border-radius:50%;background:var(--bg)}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;margin-top:-2px}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{border:0;background:none;padding:8px 14px;border-radius:999px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:7px}
.tab svg{width:18px;height:18px}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
@media (max-width:760px){
  .top{backdrop-filter:none;background:var(--bg)}
  .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
  .tab{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px;border-radius:12px}
  .tab[aria-selected="true"]{background:color-mix(in oklab,var(--accent) 16%,transparent);color:var(--ink)}
  main{padding-bottom:90px !important}
}

main{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:18px 48px}
.panel{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;min-width:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}

.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);color:var(--ink);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.small{padding:7px 13px;font-size:13px}
.btn svg{width:18px;height:18px}
.btn[disabled]{opacity:.5;cursor:default}

/* example banner */
.banner{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 18px;border-radius:var(--r);background:color-mix(in oklab,var(--sun) 26%,var(--surface));border:1.5px dashed color-mix(in oklab,var(--sun) 70%,var(--ink) 10%)}
.banner b{font-family:var(--display);font-weight:600;font-size:17px}
.banner p{margin:0;flex:1 1 260px;min-width:0}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;background:linear-gradient(135deg,color-mix(in oklab,var(--accent) 12%,var(--surface)),var(--surface) 55%,color-mix(in oklab,var(--c-wifi) 12%,var(--surface)))}
@media (max-width:560px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}}
.ring{width:180px;height:180px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .pct{font-family:var(--display);font-size:42px;font-weight:700;line-height:1}
.ring .lbl{font-size:12px;color:var(--muted);font-weight:600}
.hero h1{font-size:clamp(26px,4vw,36px)}
.hero .sub{font-size:17px;margin:6px 0 14px;color:var(--muted)}
.stats{display:flex;gap:22px;flex-wrap:wrap}
@media (max-width:560px){.stats{justify-content:center}}
.stat b{display:block;font-family:var(--display);font-size:24px;font-weight:600}
.stat span{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px}

/* bill tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{--c:var(--c-other);position:relative;background:color-mix(in oklab,var(--c) 11%,var(--surface));border:1.5px solid color-mix(in oklab,var(--c) 25%,transparent);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tile.paid{background:var(--surface);border-color:var(--line)}
.tile-top{display:flex;gap:12px;align-items:center}
.ico{width:44px;height:44px;border-radius:14px;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.ico svg{width:24px;height:24px}
.tile-name{font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.tile-sub{font-size:13px;color:var(--muted)}
.tile-amt{font-family:var(--display);font-size:24px;font-weight:600}
.tile-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.paid{background:color-mix(in oklab,var(--good) 18%,transparent);color:var(--good)}
.pill.late{background:color-mix(in oklab,var(--bad) 16%,transparent);color:var(--bad)}
.pill.soon{background:color-mix(in oklab,var(--warn) 20%,transparent);color:color-mix(in oklab,var(--warn) 75%,var(--ink))}
.pill.up{background:var(--surface-2);color:var(--muted)}
.pay-btn{border:0;border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;background:var(--c);color:#fff;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.pay-btn svg{width:16px;height:16px}
.tile.paid .pay-btn{background:var(--surface-2);color:var(--muted)}
.mini-bar{height:6px;border-radius:9px;background:color-mix(in oklab,var(--c) 18%,transparent);overflow:hidden}
.mini-bar i{display:block;height:100%;background:var(--c);border-radius:9px}

.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.section-head h2{font-size:22px}

.next-list{display:flex;flex-direction:column;gap:10px}
.next{display:flex;align-items:center;gap:12px;padding:10px;border-radius:var(--r-sm);background:var(--surface-2)}
.next .ico{width:38px;height:38px;border-radius:12px}
.next .ico svg{width:20px;height:20px}
.next .grow{flex:1;min-width:0}
.next .when{font-size:13px;color:var(--muted)}

.big-bar{height:16px;border-radius:99px;background:var(--surface-2);overflow:hidden;position:relative}
.big-bar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,var(--good),color-mix(in oklab,var(--good) 60%,var(--sun)))}
.big-num{font-family:var(--display);font-size:30px;font-weight:600;line-height:1.1}

/* plan */
.seg{display:inline-flex;background:var(--surface-2);border-radius:20px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
input[type=range]{width:100%;accent-color:var(--accent)}
.order{display:flex;flex-direction:column;gap:10px;counter-reset:o}
.order-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-sm);border:1.5px solid var(--line)}
.order-item .step{font-family:var(--display);font-weight:700;font-size:18px;width:28px;text-align:center;color:var(--muted)}
.order-item .grow{flex:1;min-width:0}
.money-map{display:flex;height:34px;border-radius:12px;overflow:hidden;gap:3px}
.money-map div{display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;min-width:0;overflow:hidden;white-space:nowrap}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.paychecks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.paychecks{grid-template-columns:1fr}}
.paycheck{border-radius:var(--r-sm);background:var(--surface-2);padding:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}

/* charts */
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:300px}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}

/* reasons */
.reasons{display:flex;flex-direction:column;gap:10px}
.reason{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-sm);background:var(--surface-2)}
.reason .dot{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff}
.reason .dot svg{width:17px;height:17px}
.reason p{margin:0}
.reason b{display:block}

/* bills table */
.bill-list{display:flex;flex-direction:column;gap:8px}
.bill-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:10px;border-radius:var(--r-sm);border:1.5px solid var(--line)}
.bill-row .ico{width:38px;height:38px;border-radius:12px}.bill-row .ico svg{width:20px;height:20px}
.bill-row .meta{font-size:13px;color:var(--muted)}
@media (max-width:520px){.bill-row{grid-template-columns:auto 1fr auto}.bill-row .acts{grid-column:1/-1;justify-self:end}}
.icon-btn{border:0;background:var(--surface-2);border-radius:10px;width:36px;height:36px;display:inline-grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn svg{width:18px;height:18px}

/* talk */
.talk{display:flex;flex-direction:column;height:min(640px,calc(100vh - 220px));min-height:420px;padding:0;overflow:hidden}
.msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:min(82%,560px);padding:10px 14px;border-radius:18px;line-height:1.45;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:6px}
.msg .did{display:block;font-size:12px;font-weight:700;color:var(--good);margin-top:6px}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);align-items:center}
.composer input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:999px;padding:11px 16px;background:var(--bg)}
.mic{width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;flex:none}
.mic svg{width:22px;height:22px}
.mic.live{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in oklab,var(--accent) 60%,transparent)}100%{box-shadow:0 0 0 16px transparent}}
.suggest{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 12px}
.suggest button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer}
.switch input{accent-color:var(--accent);width:18px;height:18px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,24,20,.5);z-index:50;display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);border-radius:24px;width:min(640px,100%);max-height:calc(100vh - 32px);overflow-y:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.sheet h2{font-size:26px}
.sheet .lead{color:var(--muted);margin:6px 0 18px}
.steps{display:flex;gap:6px;margin-bottom:16px}
.steps i{height:6px;flex:1;border-radius:9px;background:var(--surface-2)}
.steps i.on{background:var(--accent)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:700}
.field input,.field select{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);width:100%;min-width:0}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.fields{grid-template-columns:1fr}}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.pick button{--c:var(--c-other);border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;font-weight:600;font-size:13px;text-align:center}
.pick button .ico{width:42px;height:42px}
.pick button[aria-pressed="true"]{border-color:var(--c);background:color-mix(in oklab,var(--c) 12%,var(--surface))}
.wiz-bill{border:1.5px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.wiz-bill .ico{width:38px;height:38px;border-radius:12px}.wiz-bill .ico svg{width:20px;height:20px}
.wiz-bill .f4{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}

@media (max-width:560px){.wiz-bill .f4,.wiz-bill .f4.debt{grid-template-columns:1fr 1fr}}
.wiz-bill .field label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.wiz-bill .field input{padding:8px 10px}
.goal{display:flex;flex-direction:column;gap:8px}
.goal label{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:2px solid var(--line);border-radius:14px;cursor:pointer}
.goal label:has(input:checked){border-color:var(--accent);background:color-mix(in oklab,var(--accent) 8%,var(--surface))}
.goal input{accent-color:var(--accent);margin-top:4px}
.sheet-foot{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.drop-zone{border:2px dashed var(--line);border-radius:16px;padding:22px;text-align:center;cursor:pointer}
.drop-zone.over{border-color:var(--accent);background:color-mix(in oklab,var(--accent) 8%,transparent)}
.preview{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:12px;margin-top:12px}
.preview table{border-collapse:collapse;width:100%;font-size:13px}
.preview th,.preview td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.preview th{position:sticky;top:0;background:var(--surface-2)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:14px 20px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:min(460px,calc(100vw - 32px));display:flex;gap:12px;align-items:center;animation:rise .35s ease}
.toast b{font-family:var(--display);font-weight:600;font-size:17px;display:block}
@media (max-width:760px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
@keyframes rise{from{opacity:0;transform:translate(-50%,16px)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:55;width:100%;height:100%}
.spend-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.spend{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:var(--r-sm);background:color-mix(in oklab,var(--c) 9%,var(--surface));border:1.5px solid color-mix(in oklab,var(--c) 20%,transparent)}
.spend .ico{width:40px;height:40px;border-radius:12px}.spend .ico svg{width:21px;height:21px}
.spend .stop{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.spend .per{font-size:12px;color:var(--muted);font-weight:600}
.spend .mini-bar{margin-top:6px;height:8px}
.spend .note{font-size:12.5px;margin-top:4px;font-weight:600}
.spend .note.ok{color:var(--good)}.spend .note.near{color:color-mix(in oklab,var(--warn) 75%,var(--ink))}.spend .note.over{color:var(--bad)}
.spend-row{display:grid;grid-template-columns:auto 1fr 110px 120px;gap:10px;align-items:center;padding:8px 10px;border:1.5px solid var(--line);border-radius:14px}
.spend-row .ico{width:36px;height:36px;border-radius:11px}.spend-row .ico svg{width:19px;height:19px}
.spend-row input,.spend-row select{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);width:100%;min-width:0}
@media (max-width:520px){.spend-row{grid-template-columns:auto 1fr 1fr}.spend-row>div:nth-child(2){grid-column:2/-1}.spend-row input{grid-column:2}}
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.mod{display:flex;gap:12px;align-items:center;padding:12px 14px;border:2px solid var(--line);border-radius:16px;cursor:pointer;font-size:14px;line-height:1.35}
.mod:has(input:checked){border-color:var(--c);background:color-mix(in oklab,var(--c) 9%,var(--surface))}
.mod input{accent-color:var(--accent);width:20px;height:20px;flex:none}
.mod .ico{width:38px;height:38px;border-radius:12px;flex:none}.mod .ico svg{width:20px;height:20px}
.mod.locked{opacity:.85;cursor:default}
.up-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.up-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:10px 12px;border-radius:var(--r-sm);border:1.5px solid color-mix(in oklab,var(--c) 22%,var(--line));background:color-mix(in oklab,var(--c) 6%,var(--surface))}
.up-row .ico{width:38px;height:38px;border-radius:12px}.up-row .ico svg{width:20px;height:20px}
.up-row .meta{font-size:12.5px;color:var(--muted)}
.up-row .mini-bar{--c:var(--good)}
@media (max-width:620px){.up-row{grid-template-columns:auto 1fr}.up-row .pill{grid-column:2;justify-self:start}.up-row .acts{grid-column:1/-1;justify-self:end}}
.checkin{border:2px solid color-mix(in oklab,var(--c) 45%,transparent);background:color-mix(in oklab,var(--c) 9%,var(--surface))}
.checkin .ico{width:48px;height:48px;border-radius:15px}
.foot-note{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* saved light */
.save-status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted,#667);white-space:nowrap;padding:3px 10px;border:1px solid var(--line,#ccd);border-radius:99px;background:var(--surface,transparent)}
.save-dot{width:8px;height:8px;border-radius:50%;background:var(--good,#2C8A57);flex:none}
.save-dot.saving{background:var(--warn,#E39A00);animation:svpulse .9s infinite ease-in-out}
.save-dot.error{background:var(--bad,#C2453A)}
.save-dot.example{background:var(--muted,#889)}
@keyframes svpulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.save-dot.saving{animation:none}}

const thisMonth=mkey(now);
function paidIn(b,month){return state.payments.filter(p=>p.billId===b.id&&p.date.slice(0,7)===month).reduce((s,p)=>s+p.amount,0)}
function dueDateThisMonth(b){return new Date(now.getFullYear(),now.getMonth(),Math.min(b.dueDay||1,dim(now.getFullYear(),now.getMonth())))}
const BFREQ={month:{l:'Monthly',n:1},quarter:{l:'Every 3 months',n:3},half:{l:'Every 6 months',n:6},year:{l:'Yearly',n:12}};
const bfreq=b=>BFREQ[b.freq]?b.freq:'month';
const billMonthly=b=>(+b.amount||0)/BFREQ[bfreq(b)].n;
function nextDue(b){ const f=bfreq(b); if(f==='month') return dueDateThisMonth(b);
  const n=BFREQ[f].n, dm=((+b.dueMonth||now.getMonth()+1)-1), cur=now.getFullYear()*12+now.getMonth();
  let k=Math.floor(cur/12)*12+dm; while(k<cur) k+=n; while(k-n>=cur) k-=n;
  const y=Math.floor(k/12), m=k%12; return new Date(y,m,Math.min(b.dueDay||1,dim(y,m))) }
const dueThisMonth=b=>bfreq(b)==='month'||mkey(nextDue(b))===thisMonth;
function paidSince(b,fromYmd){return state.payments.filter(p=>p.billId===b.id&&p.date>=fromYmd).reduce((s,p)=>s+p.amount,0)}
function status(b){
  if(bfreq(b)!=='month'){ const D=nextDue(b), today=new Date(now.getFullYear(),now.getMonth(),now.getDate()); const days=Math.round((D-today)/864e5);
    const win=ymd(new Date(D.getTime()-45*864e5)); if(paidSince(b,win)>=b.amount*0.98&&b.amount>0) return {k:'paid',t:'Paid'};
    const prevWin=ymd(new Date(today.getTime()-30*864e5)); if(days>45&&paidSince(b,prevWin)>=b.amount*0.98&&b.amount>0) return {k:'paid',t:'Paid'};
    if(days<0) return {k:'late',t:days===-1?'Due yesterday':`${-days} days past due`};
    if(days===0) return {k:'soon',t:'Due today'};
    if(days<=45) return {k:'soon',t:`Due in ${days} day${days>1?'s':''}`};
    return {k:'up',t:`Due ${MONTHS[D.getMonth()]} ${D.getFullYear()}`}; }
  const paid=paidIn(b,thisMonth);
  if(paid>=b.amount*0.98&&paid>0) return {k:'paid',t:'Paid'};
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const days=Math.round((dueDateThisMonth(b)-today)/864e5);
  if(days<0) return {k:'late',t:days===-1?'Due yesterday':`${-days} days past due`};
  if(days===0) return {k:'soon',t:'Due today'};
  if(days<=5) return {k:'soon',t:`Due in ${days} day${days>1?'s':''}`};
  return {k:'up',t:`Due the ${ord(b.dueDay)}`};
}

function weekStart(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
const spendMonthly=()=>mod('spending')?(state.spending||[]).reduce((s,it)=>s+perMonth(it),0):0;
const weeklyItems=()=>(state.spending||[]).filter(it=>it.freq==='week');
function periodStart(freq){return freq==='week'?ymd(weekStart(now)):freq==='month'?thisMonth+'-01':now.getFullYear()+'-01-01'}

const spentNow=it=>spentIn(it,periodStart(it.freq));

const totalDebt=()=>state.bills.filter(b=>b.isDebt).reduce((s,b)=>s+(+b.balance||0),0);
const startDebt=()=>state.bills.filter(b=>b.isDebt).reduce((s,b)=>s+(+b.startBalance||+b.balance||0),0);
function snapshotHistory(){

  if(e) e.debt=Math.round(totalDebt()); else h.push({m:thisMonth,debt:Math.round(totalDebt())});
  h.sort((a,b)=>a.m<b.m?-1:1);
}
function splitExtra(){const p=state.profile,x=+p.extra||0;
  if(p.goal==='cards') return {debt:x,cushion:0};
  if(p.goal==='cushion') return {debt:0,cushion:x};
  return {debt:Math.round(x/2),cushion:x-Math.round(x/2)};
}

/* ---------- payoff simulation ---------- */
function simulate(extra,strategy){
  const ds=debts().map(b=>({id:b.id,name:b.name,cat:b.cat,bal:+b.balance,apr:+b.apr||0,min:Math.max(+b.amount||0,1)}));
  const budget=ds.reduce((s,d)=>s+d.min,0)+extra;
  const order=ds.slice().sort(strategy==='snowball'?(a,b)=>a.bal-b.bal:(a,b)=>b.apr-a.apr||a.bal-b.bal);
  let month=0,interest=0; const series=[ds.reduce((s,d)=>s+d.bal,0)]; const payoff={};
  while(ds.some(d=>d.bal>0.5)&&month<600){
    month++;
    ds.forEach(d=>{if(d.bal>0){const i=d.bal*d.apr/1200;d.bal+=i;interest+=i}});
    let left=budget;
    ds.forEach(d=>{if(d.bal>0){const p=Math.min(d.bal,d.min);d.bal-=p;left-=p}});
    for(const o of order){const d=ds.find(x=>x.id===o.id); if(d.bal>0&&left>0){const p=Math.min(d.bal,left);d.bal-=p;left-=p}}
    ds.forEach(d=>{if(d.bal<=0.5&&!payoff[d.id]){payoff[d.id]=month;d.bal=0}});
    series.push(ds.reduce((s,d)=>s+d.bal,0));
  }
  return {months:month,interest,series,payoff,order,never:month>=600};
}

  </div>`;
  const ex=$('#extra'); ex.oninput=()=>{$('#xv').textContent=money(ex.value)}; ex.onchange=()=>{p.extra=+ex.value;save();renderPlan()};
  $('#cu-s').onchange=e=>{state.profile.cushion.saved=num(e.target.value);save();renderPlan()};

/* ---------- charts ---------- */
function niceMax(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v)));const f=v/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
const kfmt=v=>v>=1000?'$'+(v/1000).toFixed(v%1000===0?0:1)+'k':'$'+Math.round(v);
function lineChart(series,opt={}){
  const W=560,H=240,L=48,R=14,T=14,B=28;
  const n=Math.max(...series.map(s=>s.pts.length)); const max=niceMax(Math.max(...series.flatMap(s=>s.pts)));
  const x=i=>L+(n>1?i/(n-1):0)*(W-L-R), y=v=>T+(1-v/max)*(H-T-B);
  let g=''; for(let i=0;i<=4;i++){const v=max*i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${kfmt(v)}</text>`}
  let xl=''; const labels=opt.labels||null; const step=Math.max(1,Math.ceil(n/6));
  for(let i=0;i<n;i+=step){const t=labels?labels[i]:(()=>{const d=addMonths(now,i);return MONTHS[d.getMonth()]+" '"+String(d.getFullYear()).slice(2)})();xl+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${t}</text>`}
  const paths=series.map((s,si)=>{const d=s.pts.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
    const area=si===0?`<path d="${d}L${x(s.pts.length-1)},${y(0)}L${x(0)},${y(0)}Z" fill="${s.color}" opacity=".12"/>`:'';
    const last=s.pts.length-1;
    return area+`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.ghost?1.5:2.5}" ${s.ghost?'opacity=".6"':''} ${s.dash?'stroke-dasharray="5 5"':''} stroke-linejoin="round"/>`+(si===0?`<circle cx="${x(last)}" cy="${y(s.pts[last])}" r="5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`:'');}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}${xl}${paths}</svg>`;
}
function barChart(items){
  const W=560,H=220,L=48,R=10,T=14,B=28; const max=niceMax(Math.max(1,...items.map(i=>i.v)));
  const bw=(W-L-R)/items.length; const y=v=>T+(1-v/max)*(H-T-B);
  let g=''; for(let i=0;i<=4;i++){const v=max*i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${kfmt(v)}</text>`}
  const bars=items.map((it,i)=>{const bx=L+i*bw+bw*.18,w=bw*.64;return `<rect x="${bx}" y="${y(it.v)}" width="${w}" height="${Math.max(0,y(0)-y(it.v))}" rx="6" fill="${it.color}"/><text x="${bx+w/2}" y="${H-8}" text-anchor="middle">${it.l}</text>`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}${bars}</svg>`;
}

/* ---------- TRENDS ---------- */
const WHY={bolt:'Heating and cooling seasons, a rate change, or a new appliance usually explain it.',flame:'Gas climbs as the weather turns cold. Budget billing can smooth it out.',drop:'Summer watering, a leak, or a quarterly sewer charge are the usual suspects.',phone:'Promo pricing ending or an added line or device payment.',wifi:'Intro rates often end after 12 months. A quick call can bring it back down.',tv:'Streaming services raise prices often. Worth a look at what you still watch.',shield:'Insurance renews yearly and can jump. Shopping it around takes about an hour.',house:'Escrow changes when property taxes or homeowners insurance change.',transit:'Seasonal schedules and fare changes.',other:'Check the statement for a new fee or charge.'};
function reasons(){
  const out=[]; const last=mkey(addMonths(now,-1)), prev=mkey(addMonths(now,-2));
  const ref=paidIn; // per bill compare last two full months
  state.bills.forEach(b=>{
    if(b.isDebt){ const sb=b.startBalance||b.balance; const down=sb-b.balance;
      if(down>0) out.push({k:'good',icon:'downArrow',t:`${b.name} is down ${money(down)}`,d:`That's ${Math.round(down/sb*100)}% of the balance gone since you started.`,w:down});
      const monthlyInt=b.balance*b.apr/1200; if(b.apr>=18&&monthlyInt>15) out.push({k:'warn',icon:'alert',t:`${b.name} costs about ${money(monthlyInt)} a month in interest`,d:`At ${b.apr}% APR, ${Math.round(monthlyInt/b.amount*100)}% of the minimum payment goes to interest. Extra money here works hardest.`,w:monthlyInt*3});
      return; }
    if(bfreq(b)!=='month') return;
    const a=ref(b,last), c=ref(b,prev);
    if(a>0&&c>0){const diff=a-c; const r=diff/c;
      if(r>0.08&&diff>=5) out.push({k:'bad',icon:'up',t:`${b.name} went up ${money(diff)}`,d:`${monthLabel(last)} was ${money(a)} vs ${money(c)} in ${monthLabel(prev)}. ${WHY[b.cat]||WHY.other}`,w:diff*2});
      else if(r<-0.08&&diff<=-5) out.push({k:'good',icon:'downArrow',t:`${b.name} dropped ${money(-diff)}`,d:`${monthLabel(last)} came in at ${money(a)}, down from ${money(c)}.`,w:-diff});}
  });
  const early=state.bills.filter(b=>b.dueDay<=5); const es=early.reduce((s,b)=>s+b.amount,0);
  if(early.length>=2&&es>monthlyTotal()*.4) out.push({k:'info',icon:'calendar',t:`${money(es)} lands in the first five days`,d:`${early.map(b=>b.name).join(', ')} all come due early. Setting that aside from the paycheck before keeps the start of the month calm.`,w:es/10});
  const onTime=state.payments.filter(p=>{const b=state.bills.find(x=>x.id===p.billId);return b&&+p.date.slice(8)<=b.dueDay}).length;
  if(state.payments.length>5) out.push({k:'good',icon:'star',t:`${onTime} payments made on time`,d:'Every one of those protects your credit score. That streak counts.',w:5});
  const wb=weekBuckets(5).slice(0,4);
  weeklyItems().forEach(it=>{ const vals=wb.map(w=>spentIn(it,w.from,w.to)); const logged=vals.filter(v=>v>0);
    if(logged.length<2||!it.amount) return; const avg=logged.reduce((a,b)=>a+b,0)/logged.length; const diff=avg-it.amount;
    const trend=logged.length>=3&&vals[vals.length-1]>vals[0]*1.1;
    if(diff>Math.max(5,it.amount*.07)) out.push({k:'bad',icon:'up',t:`${it.name} is running ${money(diff)} a week over`,d:`You've averaged ${money(avg)} a week lately against a ${money(it.amount)} estimate.${trend?' It has climbed each week.':''} ${SPEND[it.cat]?.why||''} If this is the new normal, raise the estimate in Bills so the plan stays honest.`,w:diff*4.3});
    else if(diff<-Math.max(5,it.amount*.07)) out.push({k:'good',icon:'downArrow',t:`${it.name} is ${money(-diff)} a week under`,d:`You've averaged ${money(avg)} a week against a ${money(it.amount)} estimate. That's about ${money(-diff*52/12)} a month of breathing room.`,w:-diff*4.3});
    else if(trend) out.push({k:'warn',icon:'up',t:`${it.name} is creeping up`,d:`Still close to your ${money(it.amount)} estimate, but each week has been a little higher. ${SPEND[it.cat]?.why||''}`,w:it.amount/4});
  });
  return out.sort((a,b)=>b.w-a.w).slice(0,8);
}

  <div class="grid2">

    const history=chat.slice(-8,-2).map(m=>`${m.who==='me'?'User':'Steady'}: ${m.t}`).join('\n');
    const prompt=`You are Steady, a warm, hopeful, plain-spoken bills coach inside a household bill tracker. Be encouraging but honest; never shame. Keep replies to 1-3 short sentences a person would say out loud (they may be read aloud). Use the data below; don't invent numbers. You are not a financial advisor; give practical, general guidance.

If details are missing for an add (amount or due day), ask for them instead of guessing.
DATA: ${JSON.stringify(summary)}
${history?'Recent chat:\n'+history+'\n':''}User: ${text}`;
    try{ res=await sampleFn.json(prompt,{modelTier:'quick',cache:false}); }catch(e){ if(e&&e.code==='not_granted') sampleFn=false; res=null; }
  }

const CHEERS=['Nice.','Done and done.','Look at you go.','One more off the list.','That\'s progress.','Steady wins it.'];
function mortInfo(b){ const m=b.mort; if(!m) return null; const parts=[['Principal & interest',m.pi,'var(--c-house)'],['Property taxes',m.tax,'var(--c-bank)'],['Home insurance',m.ins,'var(--c-shield)'],['PMI',m.pmi,'var(--c-brake)']].filter(x=>x[1]>0);
  const r=(m.rate||0)/1200, interest=m.balance&&r?m.balance*r:null, principal=interest!=null&&m.pi?Math.max(0,m.pi-interest):null;
  const ltv=m.balance&&m.value?m.balance/m.value:null; let toEighty=null, toEightyX=null;
  const months=(extra)=>{ if(!(m.balance&&m.value&&m.pi&&r)) return null; let bal=m.balance,k=0; const tgt=m.value*0.8; while(bal>tgt&&k<480){bal-=Math.max(0,m.pi+extra-bal*r);k++} return k>=480?null:k };
  if(ltv!=null&&ltv>0.8){ toEighty=months(0); toEightyX=months(100) }
  return {m,parts,interest,principal,ltv,equity:m.value&&m.balance!=null?m.value-m.balance:null,toEighty,toEightyX} }
function mortCardHTML(){ const b=state.bills.find(x=>x.cat==='house'&&x.mort); if(!b) return ''; const I=mortInfo(b), m=I.m, tot=I.parts.reduce((s,x)=>s+x[1],0)||1;
  const pmiMsg=m.pmi>0&&I.ltv!=null?(I.ltv<=0.8?`<div class="reason" style="margin-top:12px"><span class="dot" style="background:var(--good)">${svg('star',2.5)}</span><p><b>You may be able to drop PMI now and save ${money(m.pmi)} a month.</b><span class="muted">Your loan is at ${Math.round(I.ltv*100)}% of the home's original value. Lenders usually let you ask to remove PMI at 80% if payments are on time, and it ends automatically at 78%. Call your lender and ask how to request it. FHA loans have different rules.</span></p></div>`
      :`<div class="reason" style="margin-top:12px"><span class="dot" style="background:var(--c-bank)">${svg('calendar',2.5)}</span><p><b>PMI can come off ${I.toEighty!=null?`around ${fromNow(I.toEighty)}`:'once you reach 80%'}.</b><span class="muted">That's when the loan reaches 80% of the home's original value (now ${Math.round(I.ltv*100)}%). ${I.toEightyX!=null&&I.toEighty!=null&&I.toEighty-I.toEightyX>=2?`Adding $100 a month toward principal gets you there about ${plural(I.toEighty-I.toEightyX,'month')} sooner. `:''}Steady will remind you when you're there.</span></p></div>`):'';
  return `<div class="card"><div class="section-head"><div class="row" style="flex-wrap:nowrap">${ico('house')}<div><h2 style="font-size:20px">Where your ${esc(b.name.toLowerCase())} goes</h2><p class="muted" style="margin:2px 0 0">${money(tot)} a month${I.equity!=null?` · about ${money(I.equity)} in equity (${Math.round((1-I.ltv)*100)}%)`:''}</p></div></div><button class="btn small ghost" data-edit="${b.id}">${svg('edit')}Update</button></div>
    <div class="money-map" style="margin-top:12px">${I.parts.map(x=>`<div style="flex:${x[1]/tot};background:${x[2]}">${x[1]/tot>.14?money(x[1]):''}</div>`).join('')}</div>
    <div class="legend">${I.parts.map(x=>`<span><i style="background:${x[2]}"></i>${x[0]} <b class="num">${money(x[1])}</b></span>`).join('')}</div>
    ${I.principal!=null?`<p class="muted" style="margin:10px 0 0">This month about <b style="color:var(--good)">${money(I.principal)}</b> builds your equity and ${money(I.interest)} goes to interest. That split gets better every month.</p>`:''}
    ${pmiMsg}</div>` }
function recordPayment(b,amount,quiet){
  if(b.mort&&b.mort.balance&&b.mort.rate){ const I=mortInfo(b); if(I.principal) b.mort.balance=Math.max(0,Math.round((b.mort.balance-I.principal)*100)/100) }
  const before=debts().length?simulate(splitExtra().debt,state.profile.strategy).months:0;
  state.payments.push({id:uid(),billId:b.id,amount:amount,date:ymd(now)});
  if(b.isDebt){ const i=b.balance*(b.apr||0)/1200; b.balance=Math.max(0,Math.round((b.balance+i-amount)*100)/100); }
  if(state.example) state.example=false;
  save(); renderAll();
  const after=debts().length?simulate(splitExtra().debt,state.profile.strategy).months:0;
  const paidCount=state.bills.filter(x=>status(x).k==='paid').length;
  let line=`${paidCount} of ${state.bills.length} bills paid in ${MONTHS_L[now.getMonth()]}.`;
  if(b.isDebt) line=b.balance<=0?`${b.name} is paid off. Completely.`:`${b.name} is down to ${money(b.balance)}.`+(after<before?` Debt-free date moved up to ${fromNow(after)}.`:'');
  toast(CHEERS[Math.floor(Math.random()*CHEERS.length)]+' '+(paidCount===state.bills.length?'Every bill is paid!':''),line);
  confetti(b.isDebt&&b.balance<=0?260:90);
}
function toast(t,d){const h=$('#toastHost');h.innerHTML=`<div class="toast" role="status"><span class="ico" style="--c:var(--good);width:36px;height:36px">${svg('check',3)}</span><div><b>${esc(t)}</b>${esc(d)}</div></div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>h.innerHTML='',4200)}
function confetti(n){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=$('#confetti'); c.hidden=false; const x=c.getContext('2d'); c.width=innerWidth*devicePixelRatio; c.height=innerHeight*devicePixelRatio; x.scale(devicePixelRatio,devicePixelRatio);
  const cs=getComputedStyle(document.documentElement); const cols=['--accent','--sun','--c-house','--c-wifi','--c-tv','--good'].map(v=>cs.getPropertyValue(v).trim());
  const ps=Array.from({length:n},()=>({x:innerWidth/2,y:innerHeight*.55,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6,s:Math.random()*.3-.15}));
  let f=0;(function tick(){x.clearRect(0,0,innerWidth,innerHeight);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.a+=p.s;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
    if(++f<120) requestAnimationFrame(tick); else {x.clearRect(0,0,innerWidth,innerHeight);c.hidden=true}})();
}

/* ---------- Gmail scan ---------- */
const GMAIL='Gmail';
const decode=s=>{const t=document.createElement('textarea');t.innerHTML=String(s||'');return t.value.replace(/[͏‌​­]+/g,'').replace(/\s+/g,' ').trim()};
const SCAN_QUERIES=[
  '(statement OR "bill is ready" OR "new bill" OR "payment due" OR "amount due" OR "minimum payment" OR "payment is due") -category:promotions -category:social',
  '("payment received" OR "thank you for your payment" OR "thanks for your payment" OR "payment confirmation" OR "payment processed" OR autopay OR "automatic payment" OR "scheduled payment") -category:promotions -category:social',
  '(mortgage OR escrow OR "auto loan" OR "car payment" OR insurance OR premium OR electric OR "water bill" OR sewer OR wireless OR internet OR ferry) (payment OR bill OR statement OR due) -category:promotions -category:social'
];
async function gmailAvailable(){try{return !!(window.claude&&claude.use&&await claude.use('mcp')&&await claude.use('sample'))}catch(e){return false}}
async function scanGmail(progress){
  const mcp=await claude.use('mcp'), sample=await claude.use('sample');
  if(!mcp||!sample) throw {code:'unavailable',message:'Email scan only works when Steady is opened inside Claude.'};
  const seen=new Map();
  for(let qi=0;qi<SCAN_QUERIES.length;qi++){
    let token=''; for(let page=0;page<2;page++){
      progress(`Searching your inbox (${qi+1} of ${SCAN_QUERIES.length})… ${seen.size} emails so far`);
      const r=await mcp.callTool(GMAIL,'search_threads',Object.assign({query:SCAN_QUERIES[qi]+' newer_than:7m',pageSize:50,view:'THREAD_VIEW_MINIMAL'},token?{pageToken:token}:{}));
      const pl=r.payload||{}; (pl.threads||[]).forEach(t=>(t.messages||[]).forEach(m=>{ if(!seen.has(m.id)) seen.set(m.id,{threadId:t.id,date:(m.date||'').slice(0,10),from:m.sender||'',subject:decode(m.subject).slice(0,140),snippet:decode(m.snippet).slice(0,200)})}));
      token=pl.nextPageToken; if(!token) break;
    }
  }
  const emails=[...seen.values()].sort((a,b)=>a.date<b.date?1:-1).slice(0,260);
  if(!emails.length) return [];
  progress(`Found ${emails.length} likely bill emails. Steady is reading them now…`);
  let reads=0;
  const tools=[{name:'read_email',description:'Read the full text of one email thread when the snippet is missing the amount, due date, balance or APR. Use sparingly (at most 12 times).',
    inputSchema:{type:'object',properties:{threadId:{type:'string'}},required:['threadId']},

const KEYWORDS=[['house',/mortgage|rent|hoa|escrow|home loan/],['car',/\bcar\b|car loan|auto loan|auto finance|vehicle|toyota|ford credit|honda finance|chevy|gm financial|ally auto/],['card',/visa|master|amex|american express|discover|card|capital one|synchrony|citi|chase/],['bank',/loan|student|navient|sofi|lending|bank/],['bolt',/electric|power|dte|consumers|energy|edison/],['flame',/gas|propane|heat|semco/],['drop',/water|sewer|trash|garbage/],['tv',/cable|tv|netflix|hulu|disney|spotify|stream|youtube|directv|dish/],['wifi',/internet|wifi|broadband|comcast|xfinity|spectrum|wow|fiber/],['phone',/phone|verizon|t-mobile|tmobile|at&t|att|cricket|mint|wireless|cell/],['shield',/insurance|geico|progressive|state farm|allstate|life|health/],['transit',/ferry|toll|bus|transit|parking/]];

function readFile(f){
  const out=$('#imp-out'); out.innerHTML='<p class="muted">Reading…</p>';

  r.onload=()=>{try{
    let rows;
    if(window.XLSX){const wb=XLSX.read(new Uint8Array(r.result),{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''})}
    else{const t=new TextDecoder().decode(r.result);const [h,...ls]=t.trim().split(/\r?\n/);const hs=h.split(',');rows=ls.map(l=>Object.fromEntries(l.split(',').map((v,i)=>[hs[i],v])))}
    pending=mapRows(rows);
    if(!pending.length){out.innerHTML='<p style="color:var(--bad)">Couldn\'t find bills in that file. Make sure the first row has headers like Name and Amount.</p>';return}

  }catch(e){out.innerHTML='<p style="color:var(--bad)">That file couldn\'t be read. Try saving it as CSV and import again.</p>'}};
  r.readAsArrayBuffer(f);
}
function mapRows(rows){
  const pick=(o,res)=>{for(const k of Object.keys(o)) if(res.some(r=>r.test(k.toLowerCase().trim()))) return o[k]; return ''};
  return rows.map(o=>{
    const name=String(pick(o,[/^name$/,/bill|payee|company|creditor|account|description|vendor/])||'').trim();
    const amount=num(pick(o,[/^amount$/,/payment|min|monthly|cost|due amount/]));
    const dueRaw=pick(o,[/due/,/day|date/]);
    let dueDay=1; if(dueRaw instanceof Date) dueDay=dueRaw.getDate(); else {const s=String(dueRaw);const m=s.match(/\d{1,2}\/(\d{1,2})\//);dueDay=m?+m[1]:(parseInt(s)||1); if(typeof dueRaw==='number'&&dueRaw>31){const d=new Date(Math.round((dueRaw-25569)*864e5));dueDay=d.getUTCDate()}}
    const balance=num(pick(o,[/balance|owed|remaining|principal/])), apr=num(pick(o,[/apr|rate|interest/]));
    let cat=String(pick(o,[/categ|type/])||'').toLowerCase().trim(); if(!CATS[cat]){const byLabel=CAT_KEYS.find(k=>CATS[k].label.toLowerCase().includes(cat)&&cat);cat=byLabel||guessCat(name+' '+cat)}
    const b={id:uid(),cat,name:name||CATS[cat].label,amount,dueDay:Math.min(31,Math.max(1,dueDay))};
    const fr=String(pick(o,[/freq|how often|period|every/])||'').toLowerCase(); const f=/year|annual|12/.test(fr)?'year':/half|semi|6/.test(fr)?'half':/quarter|3/.test(fr)?'quarter':'month';
    if(f!=='month'){b.freq=f; const dm=parseInt(pick(o,[/due month/]))||((dueRaw instanceof Date)?dueRaw.getMonth()+1:(String(dueRaw).match(/^(\d{1,2})\//)||[])[1]); b.dueMonth=+dm||now.getMonth()+1}
    if(balance>0||CATS[cat].debt){b.isDebt=true;b.balance=balance;b.apr=apr;b.startBalance=balance}
    return b;
  }).filter(b=>b.name&&(b.amount>0||b.balance>0));
}
function doImport(replace){

}
function exportCSV(){const q=v=>/[",\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':v;
  offerFile('steady-bills.csv','Name,Category,Amount,How often,Due day,Due month,Balance,APR,Autopay\n'+state.bills.map(b=>[b.name,b.cat,b.amount,BFREQ[bfreq(b)].l,b.dueDay,bfreq(b)==='month'?'':MONTHS_L[(b.dueMonth||1)-1],b.balance??'',b.apr??'',b.autopay?'yes':''].map(q).join(',')).join('\n')+'\n')}

/* ---------- global actions ---------- */
document.addEventListener('change',e=>{const m=e.target.closest('[data-mod]'); if(!m||!e.target.closest('#p-bills')) return; state.profile.modules=Object.assign({},state.profile.modules,{[m.dataset.mod]:m.checked}); if(state.example) state.example=false; save(); renderAll(); toast(m.checked?`${MODS[m.dataset.mod].l} is on.`:`${MODS[m.dataset.mod].l} is off.`, m.checked?'Find it on Today and in Upkeep.':'Your info is kept if you turn it back on.')});
document.addEventListener('click',e=>{
  const tj=e.target.closest('[data-tabjump]'); if(tj){tab=tj.dataset.tabjump;renderTabs();renderPanel();window.scrollTo({top:0});return}
  const ud=e.target.closest('[data-up-done]'); if(ud){const it=up().items.find(x=>x.id===ud.dataset.upDone); if(it) upDoneModal(it); return}
  const un=e.target.closest('[data-up-notyet]'); if(un){const it=up().items.find(x=>x.id===un.dataset.upNotyet); if(it) upNotYetModal(it); return}
  const ue=e.target.closest('[data-up-edit]'); if(ue){const it=up().items.find(x=>x.id===ue.dataset.upEdit); if(it) upEditModal(it); return}
  const ua=e.target.closest('[data-up-add]'); if(ua){const [k,vid]=ua.dataset.upAdd.split(':'); upEditModal(null,k,vid); return}
  const uo=e.target.closest('[data-up-odo]'); if(uo){const v=up().vehicles.find(x=>x.id===uo.dataset.upOdo); if(v) odoModal(v); return}
  const uv=e.target.closest('[data-up-veh]'); if(uv){const v=up().vehicles.find(x=>x.id===uv.dataset.upVeh); if(v) vehModal(v); return}
  const sl=e.target.closest('[data-spend-log]'); if(sl){spendLogModal(sl.dataset.spendLog);return}
  const se=e.target.closest('[data-spend-edit]'); if(se){spendEditModal(state.spending.find(x=>x.id===se.dataset.spendEdit));return}
  const sd=e.target.closest('[data-spend-del]'); if(sd){ if(sd.dataset.confirm){state.spending=state.spending.filter(x=>x.id!==sd.dataset.spendDel);if(state.example)state.example=false;save();renderAll()} else {sd.dataset.confirm='1';sd.style.background='var(--bad)';sd.style.color='#fff';setTimeout(()=>{if(sd.isConnected){delete sd.dataset.confirm;sd.style.background='';sd.style.color=''}},3000)} return}
  const t=e.target.closest('[data-act],[data-pay],[data-edit],[data-del],[data-close]'); if(!t) return;
  if(t.dataset.close!==undefined) return closeModal();
  if(t.dataset.pay){const b=state.bills.find(x=>x.id===t.dataset.pay); if(b) payModal(b); return}
  if(t.dataset.edit){billModal(state.bills.find(x=>x.id===t.dataset.edit));return}
  if(t.dataset.del){const id=t.dataset.del;const b=state.bills.find(x=>x.id===id);
    if(t.dataset.confirm){state.bills=state.bills.filter(x=>x.id!==id);if(state.example)state.example=false;save();renderAll()} else {t.dataset.confirm='1';t.style.background='var(--bad)';t.style.color='#fff';t.setAttribute('aria-label','Tap again to remove '+b.name);setTimeout(()=>{if(t.isConnected){delete t.dataset.confirm;t.style.background='';t.style.color=''}},3000)} return}
  const a=t.dataset.act;
  if(a==='wizard') startWizard();
  if(a==='import') importModal();
  if(a==='gmail') emailModal();
  if(a==='add') billModal(null);
  if(a==='cushion') cushionModal();
  if(a==='spend-log') spendLogModal();
  if(a==='up-addveh') vehModal(null);
  if(a==='up-budget') upBudget();
  if(a==='up-home') homeAddModal();
  if(a==='labels') labelsModal();
  if(a==='up-papers') papersAddModal();
  if(a==='up-pcustom'){ closeModal(); upEditModal(null,'papers'); }
  if(a==='up-homefund') homeFund();
  if(a==='up-health'){ ['dentist','doctor','eye'].forEach(t=>{if(!up().items.some(x=>x.type===t)) up().items.push(newUpItem(t))}); if(state.example) state.example=false; save(); renderAll(); toast('Checkups added.','Tap the pencil on each to set when you last went.') }
  if(a==='spend-add') spendEditModal(null);
  if(a==='export') exportCSV();
  if(a==='reset-ask') $('#reset-zone').innerHTML=`<p><b>Clear every bill and payment?</b> This can't be undone.</p><div class="row"><button class="btn ghost" data-act="reset-no">Keep everything</button><button class="btn" style="background:var(--bad);color:#fff" data-act="reset-yes">Yes, clear it</button></div>`;
  if(a==='reset-no') renderBills();
  if(a==='reset-yes'){state=blankState();save();tab='today';renderAll();startWizard()}
});

/* ---------- render ---------- */
function renderPanel(){({today:renderToday,plan:renderPlan,trends:renderTrends,upkeep:renderUpkeep,bills:renderBills,talk:renderTalk})[tab]()}
function renderAll(){renderBanner();renderTabs();renderPanel()}
state=exampleState();
renderAll();
initStore();
</script>
