<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NUMBER MUNCHERS</title>
<style>
  :root{
    --green: #33ff66;
    --dimgreen: #0a3d1c;
    --amber: #ffd23f;
    --bg: #001004;
    --danger: #ff4d4d;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background: #000;
    display:flex; align-items:center; justify-content:center;
    font-family: 'Courier New', monospace;
    color: var(--green);
    overflow:hidden;
  }
  #crt{
    position:relative;
    width: 620px;
    max-width: 96vw;
    background: var(--bg);
    border: 3px solid var(--green);
    border-radius: 10px;
    box-shadow: 0 0 0 4px #000, 0 0 24px rgba(51,255,102,0.35), inset 0 0 40px rgba(51,255,102,0.06);
    padding: 14px 16px 18px;
  }
  #crt::after{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.15) 0px,
      rgba(0,0,0,0.15) 1px,
      transparent 2px,
      transparent 3px
    );
    pointer-events:none;
    border-radius: 8px;
    mix-blend-mode: multiply;
  }
  h1{
    text-align:center;
    letter-spacing: 3px;
    word-spacing: 10px;
    font-size: 22px;
    margin: 2px 0 10px;
    text-shadow: 0 0 8px var(--green);
  }
  #hud{
    display:flex; justify-content:space-between; align-items:center;
    font-size: 13px; margin-bottom: 8px; padding: 0 2px;
    letter-spacing:1px;
  }
  #rule{
    text-align:center;
    background: var(--dimgreen);
    border: 2px solid var(--green);
    border-radius: 4px;
    padding: 6px 4px;
    margin-bottom: 10px;
    font-size: 15px;
    letter-spacing: 1px;
    text-shadow: 0 0 6px var(--green);
  }
  #board{
    display:grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 5px;
    background: #000;
    border: 2px solid var(--dimgreen);
    padding: 6px;
    border-radius: 6px;
    position:relative;
    min-height: 340px;
  }
  .cell{
    aspect-ratio: 1 / 0.72;
    background: #001a08;
    border: 1px solid var(--dimgreen);
    display:flex; align-items:center; justify-content:center;
    font-size: 19px;
    font-weight:bold;
    color: var(--green);
    border-radius: 3px;
    user-select:none;
  }
  .cell.eaten{
    background:#000;
    border-color:#052312;
    color:transparent;
    transition: background 0.3s ease, border-color 0.3s ease;
  }
  .num{
    display:inline-block;
    transition: transform 0.22s cubic-bezier(.5,-0.3,.5,1.4), opacity 0.22s ease;
  }
  .num.gulp{
    transform: scale(0.15) translateY(6px) rotate(20deg);
    opacity: 0;
  }
  .cell.cheat-glow{
    border-color: var(--amber);
    animation: cheatPulse 1s ease-in-out infinite;
  }
  @keyframes cheatPulse{
    0%, 100% { box-shadow: 0 0 4px 1px rgba(255,210,63,0.5) inset, 0 0 5px rgba(255,210,63,0.5); }
    50%      { box-shadow: 0 0 12px 3px rgba(255,210,63,0.9) inset, 0 0 10px rgba(255,210,63,0.9); }
  }
  #cheatIndicator{
    position:absolute; top:8px; right:12px;
    font-size:11px; color: var(--amber); text-shadow:0 0 6px var(--amber);
    letter-spacing:1px; opacity:0; pointer-events:none; z-index:30;
    transition: opacity 0.2s ease;
  }
  #cheatIndicator.on{ opacity: 0.8; }
  .sprite{
    display:flex; align-items:center; justify-content:center;
    font-size: 26px;
    z-index: 5;
    pointer-events:none;
    line-height:1;
  }
  #player{
    position: relative;
    z-index: 6;
  }
  .frog{
    position: relative;
    width: clamp(26px, 7vw, 34px);
    height: clamp(26px, 7vw, 34px);
    transition: transform 0.1s ease;
  }
  #player.chomp .frog{
    animation: frogHop 0.36s cubic-bezier(.3,0,.15,1);
  }
  .frog-jaw{
    position: absolute;
    left: 10%; right: 10%;
    top: 46%;
    height: 40%;
    background: linear-gradient(#8a1c1c, #3a0a0a);
    border-radius: 0 0 40% 40%;
    box-shadow: inset 0 2px 3px rgba(0,0,0,0.5);
    transform-origin: 50% 0%;
    transform: scaleY(0.05);
    z-index: 1;
    overflow: hidden;
  }
  .frog-jaw::before{
    /* little teeth along the top edge of the open mouth */
    content:"";
    position:absolute;
    top:0; left:8%; right:8%;
    height:34%;
    background: #fff;
    clip-path: polygon(0% 0%, 10% 100%, 20% 0%, 30% 100%, 40% 0%, 50% 100%, 60% 0%, 70% 100%, 80% 0%, 90% 100%, 100% 0%);
  }
  #player.chomp .frog-jaw{
    animation: jawChomp 0.36s cubic-bezier(.15,.75,.2,1);
  }
  .frog-mouth-line{
    position: absolute;
    left: 30%; right: 30%;
    top: 64%;
    height: 12%;
    border-bottom: 2.5px solid #1c6b2c;
    border-radius: 0 0 50% 50%;
    z-index: 3;
    transition: opacity 0.08s ease;
  }
  #player.chomp .frog-mouth-line{
    opacity: 0;
  }
  .frog-head{
    position: absolute;
    left: 0; right: 0;
    top: 14%;
    height: 62%;
    background: radial-gradient(circle at 35% 30%, #57e07f, #2fae49);
    border-radius: 50% 50% 42% 42%;
    box-shadow: inset 0 -3px 3px rgba(0,0,0,0.18), 0 0 6px rgba(255,210,63,0.55);
    z-index: 2;
  }
  .cheek{
    position: absolute;
    width: 15%; height: 11%;
    background: rgba(255,140,150,0.55);
    border-radius: 50%;
    top: 55%;
    z-index: 3;
  }
  .cheek-l{ left: 4%; }
  .cheek-r{ right: 4%; }
  .eye{
    position: absolute;
    top: -4%;
    width: 32%;
    height: 32%;
    background: #eafff0;
    border: 1.5px solid #1c6b2c;
    border-radius: 50%;
    z-index: 3;
  }
  .eye::after{
    content:"";
    position:absolute;
    top: 22%; left: 30%;
    width: 38%; height: 38%;
    background:#0b2b10;
    border-radius:50%;
  }
  .eye::before{
    /* tiny sparkle for a happier look */
    content:"";
    position:absolute;
    top: 30%; left: 55%;
    width: 14%; height: 14%;
    background:#fff;
    border-radius:50%;
    z-index:4;
  }
  .eye-l{ left: -2%; }
  .eye-r{ right: -2%; }
  @keyframes jawChomp{
    0%   { transform: scaleY(0.05); }
    22%  { transform: scaleY(1.8); }
    45%  { transform: scaleY(1.5); }
    100% { transform: scaleY(0.05); }
  }
  @keyframes frogHop{
    0%   { transform: translateY(0) scale(1,1); }
    25%  { transform: translateY(-4px) scale(1.1,0.86); }
    50%  { transform: translateY(1px) scale(0.92,1.08); }
    100% { transform: translateY(0) scale(1,1); }
  }
  .troggle{
    font-size: 26px;
    filter: drop-shadow(0 0 5px rgba(255,77,77,0.7));
  }
  #footer{
    display:flex; justify-content:space-between;
    margin-top:10px; font-size:11px; color:#1f8f45; letter-spacing:0.5px;
  }
  #overlay{
    position:absolute; inset:0;
    background: rgba(0,10,3,0.92);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding: 16px; border-radius:8px;
    z-index: 20;
    overflow-y:auto;
    box-sizing:border-box;
  }
  #overlay h2{
    font-size:20px; letter-spacing:3px; word-spacing:8px; margin: 4px 0 10px; text-shadow:0 0 8px var(--green);
  }
  #overlay p{ font-size:12.5px; line-height:1.55; max-width:420px; color:#8fe3a8; margin: 0 0 10px; }
  .blink{ animation: blink 1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }
  button.retro{
    margin-top:10px;
    background:#000; color:var(--green); border:2px solid var(--green);
    font-family:inherit; font-size:14px; letter-spacing:2px; word-spacing:4px; padding:9px 18px;
    cursor:pointer; border-radius:4px;
    flex-shrink:0;
  }
  button.retro:hover{ background:var(--dimgreen); }
  .hs-table{
    border-collapse: collapse;
    margin: 6px 0 4px;
    font-size: 12.5px;
    width: 100%;
    max-width: 320px;
  }
  .hs-table th, .hs-table td{
    padding: 3px 8px;
    text-align: left;
    border-bottom: 1px solid var(--dimgreen);
    color: var(--green);
  }
  .hs-table th{
    color: #8fe3a8;
    font-weight: normal;
    letter-spacing: 1px;
  }
  .hs-table tr.hs-new td{
    color: var(--amber);
    text-shadow: 0 0 6px var(--amber);
  }
  .initials-input{
    background:#000;
    border: 2px solid var(--amber);
    color: var(--amber);
    font-family: inherit;
    font-size: 22px;
    letter-spacing: 10px;
    text-align: center;
    width: 110px;
    padding: 6px 0 6px 10px;
    margin: 4px 0 12px;
    text-transform: uppercase;
    border-radius: 4px;
    text-shadow: 0 0 6px var(--amber);
  }
  .initials-input:focus{ outline:none; }
  #banner{
    position:absolute; left:50%; top:44%; transform:translate(-50%,-50%);
    background:#000; border:2px solid var(--amber); color:var(--amber);
    padding: 10px 22px; border-radius:6px; font-size:16px; letter-spacing:2px;
    z-index: 25; text-shadow:0 0 8px var(--amber); display:none;
  }
  #hearts span{ margin-right:2px; }
</style>
</head>
<body>
<div id="crt">
  <div id="cheatIndicator">C</div>
  <h1>NUMBER MUNCHERS</h1>
  <div id="hud">
    <div>SCORE: <span id="score">0</span></div>
    <div>LEVEL: <span id="level">1</span></div>
    <div>LIVES: <span id="hearts"></span></div>
  </div>
  <div id="rule">MUNCH: ...</div>
  <div id="board"></div>
  <div id="footer">
    <span>ARROWS / WASD TO MOVE &middot; SPACE TO MUNCH</span>
    <span>WRONG MUNCH = LOSE A LIFE</span>
  </div>
  <div id="banner"></div>
  <div id="overlay"></div>
</div>

<script>
(function(){
  const ROWS = 5, COLS = 6, TOTAL = ROWS*COLS;
  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const levelEl = document.getElementById('level');
  const heartsEl = document.getElementById('hearts');
  const ruleEl = document.getElementById('rule');
  const overlay = document.getElementById('overlay');
  const banner = document.getElementById('banner');

  const HS_KEY = 'number_munchers_highscores';
  const MAX_SCORES = 8;
  let highScores = [];
  let overlayMode = 'start'; // 'start' | 'scores' | 'initials' | 'gameover'

  let score = 0, level = 1, lives = 3;
  let grid = [];       // {value, correct, eaten, el}
  let player = {row:2, col:2};
  let troggles = [];   // {row,col,el}
  let running = false;
  let invulnerable = false;
  let cheatMode = false;
  let troggleTimer = null;
  let audioCtx = null;

  function getAudio(){
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  // Plays one soft, rounded note. type defaults to a warm triangle wave
  // (much cuter/softer than a harsh square or sawtooth).
  function playNote(freq, startDelay, dur, opts){
    opts = opts || {};
    try{
      const ctx = getAudio();
      const t0 = ctx.currentTime + (startDelay||0);
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = opts.type || 'triangle';
      o.frequency.setValueAtTime(freq, t0);
      if(opts.slideTo){
        o.frequency.exponentialRampToValueAtTime(Math.max(opts.slideTo,1), t0 + dur);
      }
      // gentle wobble for a "cute" character
      if(opts.wobble){
        const lfo = ctx.createOscillator();
        const lfoGain = ctx.createGain();
        lfo.frequency.value = opts.wobbleRate || 18;
        lfoGain.gain.value = opts.wobbleDepth || 12;
        lfo.connect(lfoGain);
        lfoGain.connect(o.frequency);
        lfo.start(t0);
        lfo.stop(t0 + dur);
      }
      const peak = opts.gain || 0.08;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0);
      o.stop(t0 + dur + 0.02);
    }catch(e){}
  }

  // A bright little "ding" arpeggio for a correct, tasty munch.
  function playCorrectMunch(){
    playNote(784, 0,    0.09, { type:'triangle', gain:0.09 });
    playNote(988, 0.05, 0.12, { type:'triangle', gain:0.09 });
  }

  // A soft, harmless "boop" — a wrong munch shouldn't sting, just nudge.
  function playWrongMunch(){
    playNote(320, 0, 0.14, { type:'sine', slideTo:220, gain:0.06 });
  }

  // A cute descending "aww" slide when a troggle catches the muncher.
  function playCaught(){
    playNote(500, 0, 0.4, { type:'sine', slideTo:140, gain:0.08, wobble:true, wobbleRate:22, wobbleDepth:18 });
  }

  // A cheerful little fanfare for clearing a level.
  function playLevelClear(){
    const notes = [523, 659, 784, 1047];
    notes.forEach((f,i)=> playNote(f, i*0.11, 0.16, { type:'triangle', gain:0.09 }));
  }

  // A tiny happy chirp when the game starts.
  function playStartChirp(){
    playNote(660, 0,    0.08, { type:'triangle', gain:0.08 });
    playNote(880, 0.09, 0.14, { type:'triangle', gain:0.08 });
  }

  // ---- High score persistence ----
  async function loadHighScores(){
    try{
      if(!window.storage) return [];
      const res = await window.storage.get(HS_KEY, false);
      if(res && res.value){
        const parsed = JSON.parse(res.value);
        if(Array.isArray(parsed)) return parsed;
      }
    }catch(e){ /* no saved scores yet, or storage unavailable */ }
    return [];
  }

  async function saveHighScores(list){
    try{
      if(!window.storage) return;
      await window.storage.set(HS_KEY, JSON.stringify(list), false);
    }catch(e){ /* best-effort only */ }
  }

  function qualifiesForHighScore(s){
    if(s <= 0) return false;
    if(highScores.length < MAX_SCORES) return true;
    return s > highScores[highScores.length-1].score;
  }

  function renderScoreRows(newEntry){
    if(!highScores.length){
      return '<tr><td colspan="4">NO SCORES YET</td></tr>';
    }
    return highScores.map((e,i)=>{
      const isNew = newEntry && e === newEntry;
      return `<tr class="${isNew ? 'hs-new' : ''}"><td>${i+1}</td><td>${e.initials}</td><td>${e.score}</td><td>${e.level}</td></tr>`;
    }).join('');
  }

  function isPrime(n){
    if(n < 2) return false;
    for(let i=2;i*i<=n;i++){ if(n%i===0) return false; }
    return true;
  }

  // ---- Level rule generator ----
  function getRule(lvl){
    const patterns = [
      ()=>{
        const n = 2 + (lvl % 6);
        return { label:`MULTIPLES OF ${n}`, max: 30+lvl*4, check:(v)=> v % n === 0 };
      },
      ()=>{
        const options = [12,18,20,24,30,36,40,48,60];
        const n = options[lvl % options.length];
        return { label:`FACTORS OF ${n}`, max: Math.max(n, 30), check:(v)=> v>0 && n % v === 0 };
      },
      ()=>{
        return { label:`PRIME NUMBERS`, max: 20+lvl*5, check:(v)=> isPrime(v) };
      },
      ()=>{
        const n = 10 + (lvl*3) % 40;
        return { label:`GREATER THAN ${n}`, max: n + 30, check:(v)=> v > n };
      },
      ()=>{
        const n = 15 + (lvl*2) % 40;
        return { label:`LESS THAN ${n}`, max: n + 25, check:(v)=> v < n && v > 0 };
      },
    ];
    const idx = (lvl-1) % patterns.length;
    const r = patterns[idx]();
    r.max = Math.max(10, Math.min(r.max, 99));
    return r;
  }

  function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

  function generateGrid(rule){
    const cells = [];
    for(let i=0;i<TOTAL;i++){
      const v = randInt(1, rule.max);
      cells.push({ value:v, correct: !!rule.check(v), eaten:false });
    }
    let correctCount = cells.filter(c=>c.correct).length;

    // ensure a healthy minimum of correct answers
    const minCorrect = 6;
    let guard = 0;
    while(correctCount < minCorrect && guard < 500){
      guard++;
      const idx = randInt(0, TOTAL-1);
      if(!cells[idx].correct){
        let v, tries=0;
        do{ v = randInt(1, rule.max); tries++; } while(!rule.check(v) && tries < 200);
        if(rule.check(v)){
          cells[idx] = { value:v, correct:true, eaten:false };
          correctCount++;
        }
      }
    }

    // cap correct answers so it isn't too easy
    const maxCorrect = 14;
    guard = 0;
    while(correctCount > maxCorrect && guard < 500){
      guard++;
      const idx = randInt(0, TOTAL-1);
      if(cells[idx].correct){
        let v, tries=0;
        do{ v = randInt(1, rule.max); tries++; } while(rule.check(v) && tries < 200);
        if(!rule.check(v)){
          cells[idx] = { value:v, correct:false, eaten:false };
          correctCount--;
        }
      }
    }
    return cells;
  }

  function remainingCorrect(){
    return grid.filter(c=>c.correct && !c.eaten).length;
  }

  // ---- Rendering ----
  function renderBoard(){
    boardEl.innerHTML = '';
    grid.forEach((cell, i)=>{
      const row = Math.floor(i/COLS), col = i%COLS;
      const div = document.createElement('div');
      div.className = 'cell' + (cell.eaten ? ' eaten' : '');
      div.style.gridRow = (row+1);
      div.style.gridColumn = (col+1);
      if(cell.eaten){
        div.textContent = '';
      } else {
        const span = document.createElement('span');
        span.className = 'num';
        span.textContent = cell.value;
        div.appendChild(span);
      }
      cell.el = div;
      boardEl.appendChild(div);
    });

    const playerEl = document.createElement('div');
    playerEl.id = 'player';
    playerEl.className = 'sprite';
    playerEl.innerHTML = '<div class="frog"><span class="eye eye-l"></span><span class="eye eye-r"></span><span class="cheek cheek-l"></span><span class="cheek cheek-r"></span><div class="frog-head"></div><div class="frog-jaw"></div><div class="frog-mouth-line"></div></div>';
    playerEl.style.gridRow = (player.row+1);
    playerEl.style.gridColumn = (player.col+1);
    boardEl.appendChild(playerEl);

    troggles.forEach(t=>{
      const el = document.createElement('div');
      el.className = 'sprite troggle';
      el.textContent = '\u{1F47E}'; // 👾 the troggle monster
      el.style.gridRow = (t.row+1);
      el.style.gridColumn = (t.col+1);
      boardEl.appendChild(el);
      t.el = el;
    });

    applyCheatHighlights();
  }

  // Hidden cheat: press "C" to make the correct answers glow amber.
  function toggleCheat(){
    cheatMode = !cheatMode;
    document.getElementById('cheatIndicator').classList.toggle('on', cheatMode);
    applyCheatHighlights();
  }

  function applyCheatHighlights(){
    grid.forEach(cell=>{
      if(cell.el){
        cell.el.classList.toggle('cheat-glow', cheatMode && cell.correct && !cell.eaten);
      }
    });
  }

  function updatePlayerPos(){
    const el = document.getElementById('player');
    if(el){
      el.style.gridRow = (player.row+1);
      el.style.gridColumn = (player.col+1);
    }
  }

  // Moves a troggle to its new grid cell instantly (so it stays perfectly
  // aligned with the numbers), then plays a measured "glide" using a
  // transform so the motion still reads as a slow slide, not a teleport.
  function glideTroggleTo(t){
    if(!t.el) return;
    if(t.wrapped){
      // snap instantly on wraparound instead of sliding across the board
      t.el.style.transition = 'none';
      t.el.style.gridRow = (t.row+1);
      t.el.style.gridColumn = (t.col+1);
      void t.el.offsetWidth;
      t.el.style.transition = '';
      return;
    }
    const before = t.el.getBoundingClientRect();
    t.el.style.gridRow = (t.row+1);
    t.el.style.gridColumn = (t.col+1);
    const after = t.el.getBoundingClientRect();
    const dx = before.left - after.left;
    const dy = before.top - after.top;
    if(dx === 0 && dy === 0) return;
    t.el.style.transition = 'none';
    t.el.style.transform = `translate(${dx}px, ${dy}px)`;
    void t.el.offsetWidth; // force reflow so the jump-back applies before transitioning
    t.el.style.transition = 'transform 0.9s cubic-bezier(.4,0,.2,1)';
    t.el.style.transform = 'translate(0px, 0px)';
  }

  function updateTrogglePositions(){
    troggles.forEach(t=> glideTroggleTo(t));
  }

  function updateHUD(){
    scoreEl.textContent = score;
    levelEl.textContent = level;
    heartsEl.innerHTML = '';
    for(let i=0;i<lives;i++){
      const s = document.createElement('span');
      s.textContent = '\u2665';
      s.style.color = '#ff4d6a';
      heartsEl.appendChild(s);
    }
  }

  function showBanner(text, ms){
    banner.textContent = text;
    banner.style.display = 'block';
    setTimeout(()=>{ banner.style.display = 'none'; }, ms||1200);
  }

  // ---- Game flow ----
  let currentRule = null;

  function startLevel(lvl){
    currentRule = getRule(lvl);
    grid = generateGrid(currentRule);
    ruleEl.textContent = 'MUNCH: ' + currentRule.label;
    player = { row: 2, col: 2 };

    const trogCount = Math.min(1 + Math.floor((lvl-1)/2), 4);
    const spawnSpots = [[0,0],[0,COLS-1],[ROWS-1,0],[ROWS-1,COLS-1]];
    troggles = [];
    for(let i=0;i<trogCount;i++){
      troggles.push({ row: spawnSpots[i][0], col: spawnSpots[i][1] });
    }
    renderBoard();
    updateHUD();
    restartTroggleTimer();
  }

  function restartTroggleTimer(){
    if(troggleTimer) clearInterval(troggleTimer);
    const speed = Math.max(1500, 2400 - level*40);
    troggleTimer = setInterval(moveTroggles, speed);
  }

  function moveTroggles(){
    if(!running) return;
    const chaseChance = Math.min(0.1 + level*0.05, 0.55);
    troggles.forEach(t=>{
      let dr = 0, dc = 0;
      if(Math.random() < chaseChance){
        const rowDiff = player.row - t.row;
        const colDiff = player.col - t.col;
        if(Math.abs(rowDiff) > Math.abs(colDiff)){
          dr = Math.sign(rowDiff);
        } else if(colDiff !== 0){
          dc = Math.sign(colDiff);
        } else if(rowDiff !== 0){
          dr = Math.sign(rowDiff);
        }
      }
      if(dr===0 && dc===0){
        const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
        const d = dirs[randInt(0,3)];
        dr = d[0]; dc = d[1];
      }
      const newRow = (t.row + dr + ROWS) % ROWS;
      const newCol = (t.col + dc + COLS) % COLS;
      // a wraparound edge-crossing shouldn't visibly glide clear across the board
      t.wrapped = Math.abs(newRow - t.row) > 1 || Math.abs(newCol - t.col) > 1;
      t.row = newRow;
      t.col = newCol;
    });
    updateTrogglePositions();
    checkTroggleCollision();
  }

  function checkTroggleCollision(){
    if(invulnerable) return;
    const hit = troggles.some(t=> t.row === player.row && t.col === player.col);
    if(hit) loseLife();
  }

  function loseLife(){
    lives--;
    updateHUD();
    playCaught();
    if(lives <= 0){
      gameOver();
      return;
    }
    invulnerable = true;
    showBanner('OUCH!', 900);
    player = { row:2, col:2 };
    updatePlayerPos();
    setTimeout(()=>{ invulnerable = false; }, 1000);
  }

  function gameOver(){
    running = false;
    clearInterval(troggleTimer);
    if(qualifiesForHighScore(score)){
      renderInitialsScreen();
    } else {
      renderGameOverScreen();
    }
  }

  function renderGameOverScreen(){
    overlayMode = 'gameover';
    overlay.style.display = 'flex';
    overlay.innerHTML = `
      <h2>GAME OVER</h2>
      <p>Final score: ${score}<br>You reached level ${level}.</p>
      <table class="hs-table">
        <thead><tr><th>#</th><th>NAME</th><th>SCORE</th><th>LVL</th></tr></thead>
        <tbody>${renderScoreRows()}</tbody>
      </table>
      <button class="retro" id="restartBtn">PLAY AGAIN</button>
    `;
    document.getElementById('restartBtn').addEventListener('click', resetGame);
  }

  function renderInitialsScreen(){
    overlayMode = 'initials';
    overlay.style.display = 'flex';
    overlay.innerHTML = `
      <h2>NEW HIGH SCORE!</h2>
      <p>Score: ${score} &mdash; reached level ${level}<br>Enter your initials:</p>
      <input id="initialsInput" class="initials-input" maxlength="3" autocomplete="off" spellcheck="false" />
      <button class="retro" id="submitInitials">SUBMIT</button>
    `;
    playLevelClear();
    const input = document.getElementById('initialsInput');
    input.focus();
    input.addEventListener('input', ()=>{
      input.value = input.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,3);
    });
    input.addEventListener('keydown', (e)=>{
      e.stopPropagation();
      if(e.key === 'Enter') submitInitials();
    });
    document.getElementById('submitInitials').addEventListener('click', submitInitials);

    function submitInitials(){
      const initials = (input.value || 'YOU').padEnd(3, ' ').slice(0,3);
      const entry = { initials, score, level };
      highScores.push(entry);
      highScores.sort((a,b)=> b.score - a.score);
      highScores = highScores.slice(0, MAX_SCORES);
      saveHighScores(highScores);
      renderGameOverScreenWithHighlight(entry);
    }
  }

  function renderGameOverScreenWithHighlight(newEntry){
    overlayMode = 'gameover';
    overlay.style.display = 'flex';
    overlay.innerHTML = `
      <h2>GAME OVER</h2>
      <p>Final score: ${score}<br>You reached level ${level}.</p>
      <table class="hs-table">
        <thead><tr><th>#</th><th>NAME</th><th>SCORE</th><th>LVL</th></tr></thead>
        <tbody>${renderScoreRows(newEntry)}</tbody>
      </table>
      <button class="retro" id="restartBtn">PLAY AGAIN</button>
    `;
    document.getElementById('restartBtn').addEventListener('click', resetGame);
  }

  function renderHighScoreBrowseScreen(){
    overlayMode = 'scores';
    overlay.style.display = 'flex';
    overlay.innerHTML = `
      <h2>HIGH SCORES</h2>
      <table class="hs-table">
        <thead><tr><th>#</th><th>NAME</th><th>SCORE</th><th>LVL</th></tr></thead>
        <tbody>${renderScoreRows()}</tbody>
      </table>
      <button class="retro" id="backBtn">BACK</button>
    `;
    document.getElementById('backBtn').addEventListener('click', renderStartScreen);
  }

  function renderStartScreen(){
    overlayMode = 'start';
    overlay.style.display = 'flex';
    overlay.innerHTML = `
      <h2>NUMBER MUNCHERS</h2>
      <p>
        Move with the arrow keys, then press SPACE to munch the number you're
        standing on. Munch a number that fits the rule to score &mdash; munch a
        wrong one and it's instant death, just like the original! Avoid the
        Troggles too &mdash; touching one also costs a life.
      </p>
      <p class="blink">PRESS ENTER OR TAP START</p>
      <button class="retro" id="startBtn">START GAME</button>
      <button class="retro" id="viewScoresBtn">HIGH SCORES</button>
    `;
    document.getElementById('startBtn').addEventListener('click', resetGame);
    document.getElementById('viewScoresBtn').addEventListener('click', renderHighScoreBrowseScreen);
  }

  function resetGame(){
    score = 0; level = 1; lives = 3;
    overlay.style.display = 'none';
    overlayMode = 'playing';
    running = true;
    playStartChirp();
    startLevel(level);
  }

  function tryMove(dr, dc){
    if(!running) return;
    player.row = (player.row + dr + ROWS) % ROWS;
    player.col = (player.col + dc + COLS) % COLS;
    updatePlayerPos();
    checkTroggleCollision();
  }

  function munch(){
    if(!running) return;
    const idx = player.row*COLS + player.col;
    const cell = grid[idx];
    if(!cell || cell.eaten) return;

    const playerEl = document.getElementById('player');
    if(playerEl){
      playerEl.classList.add('chomp');
      setTimeout(()=> playerEl.classList.remove('chomp'), 380);
    }

    // the bite snaps shut fast, so the number should vanish right on the bite
    const numEl = cell.el.querySelector('.num');
    setTimeout(()=>{ if(numEl) numEl.classList.add('gulp'); }, 60);

    cell.eaten = true;
    setTimeout(()=>{
      cell.el.classList.add('eaten');
      cell.el.classList.remove('cheat-glow');
      cell.el.textContent = '';
    }, 260);

    if(cell.correct){
      score += 10 * level;
      playCorrectMunch();
      updateHUD();
      if(remainingCorrect() === 0){
        levelComplete();
      }
    } else {
      // wrong munch: the classic rule — bite a wrong number and you're toast
      updateHUD();
      loseLife();
    }
  }

  function levelComplete(){
    running = false;
    clearInterval(troggleTimer);
    playLevelClear();
    showBanner('LEVEL CLEAR!', 1400);
    setTimeout(()=>{
      level++;
      running = true;
      startLevel(level);
    }, 1500);
  }

  // ---- Input ----
  window.addEventListener('keydown', (e)=>{
    if(document.activeElement && document.activeElement.tagName === 'INPUT') return;
    const k = e.key.toLowerCase();
    if(!running){
      if(k === 'enter' && (overlayMode === 'start' || overlayMode === 'gameover')){
        resetGame();
      }
      return;
    }
    if(k === 'arrowup' || k === 'w'){ e.preventDefault(); tryMove(-1,0); }
    else if(k === 'arrowdown' || k === 's'){ e.preventDefault(); tryMove(1,0); }
    else if(k === 'arrowleft' || k === 'a'){ e.preventDefault(); tryMove(0,-1); }
    else if(k === 'arrowright' || k === 'd'){ e.preventDefault(); tryMove(0,1); }
    else if(k === ' '){ e.preventDefault(); munch(); }
    else if(k === 'c'){ toggleCheat(); }
  });

  (async function init(){
    highScores = await loadHighScores();
    renderStartScreen();
    updateHUD();
  })();
})();
</script>
</body>
</html>
