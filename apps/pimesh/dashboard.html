<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PiMesh</title>
<link rel="icon" href="icon-256.png">
<style>
:root{
  --bg:#0a0e13; --panel:#11171f; --panel2:#151d27; --line:#1f2a37; --line2:#2a3747;
  --text:#e6edf3; --muted:#8693a4; --dim:#56627a;
  --rasp:#e5315f; --ok:#3fb950; --warn:#e3a325; --bad:#f0524f; --off:#5b6577; --info:#58a6ff;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1400px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:.2px}
.logo svg{width:30px;height:30px}
.pill{font:12px var(--mono);color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill b{color:var(--text);font-weight:600}
.spacer{flex:1}
.live{display:flex;align-items:center;gap:7px;font:12px var(--mono);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;flex:none}
.live .dot{box-shadow:0 0 0 0 rgba(63,185,80,.6);animation:pulse 2s infinite}
.live.down .dot{background:var(--bad);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,185,80,.5)}70%{box-shadow:0 0 0 8px rgba(63,185,80,0)}100%{box-shadow:0 0 0 0 rgba(63,185,80,0)}}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kpi .v{font:600 24px var(--mono);margin-top:4px;white-space:nowrap}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:500}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.card h2{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.card h2 .r{margin-left:auto;text-transform:none;letter-spacing:0;font:12px var(--mono);color:var(--dim)}

#topo{width:100%;height:330px;display:block}
.legend{display:flex;gap:14px;padding:0 14px 12px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}

#events{list-style:none;margin:0;padding:6px 0;max-height:370px;overflow:auto}
#events li{display:grid;grid-template-columns:62px 16px 1fr;gap:8px;padding:6px 14px;font-size:13px;align-items:start}
#events li .t{font:12px var(--mono);color:var(--dim);padding-top:1px}
#events li b{font-weight:600}
#events li span.m{color:var(--muted)}
.empty{padding:20px 14px;color:var(--dim);font-size:13px}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:980px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover{background:var(--panel2)}
tbody tr.sel{background:#18222f;box-shadow:inset 3px 0 0 var(--rasp)}
tbody tr.offline td{opacity:.5}
.name{font-weight:600;display:flex;align-items:center;gap:8px}
.tag{font:10px var(--mono);padding:1px 6px;border-radius:4px;background:#22303f;color:var(--muted);font-weight:500}
.tag.you{background:rgba(229,49,95,.15);color:#ff7c9c}
.tag.lead{background:rgba(227,163,37,.15);color:var(--warn)}
.sub{font-size:12px;color:var(--muted);margin-top:1px}
.mono{font-family:var(--mono);font-size:13px}
a.ip{color:var(--info);text-decoration:none;font:13px var(--mono)}
a.ip:hover{text-decoration:underline}
.bar{width:84px;height:6px;background:#1d2733;border-radius:3px;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;border-radius:3px}
.cell2{display:flex;align-items:center;gap:10px}
.hot{color:var(--bad)} .warm{color:var(--warn)} .cool{color:var(--ok)}

#detail{margin-top:14px;display:none}
#detail.show{display:block}
.dhead{display:flex;gap:18px;flex-wrap:wrap;padding:14px;border-bottom:1px solid var(--line);align-items:center}
.dhead .big{font-size:18px;font-weight:700}
.facts{display:flex;gap:22px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.facts b{display:block;color:var(--text);font:13px var(--mono);font-weight:500}
.charts{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
@media(max-width:900px){.charts{grid-template-columns:1fr}}
.chart{padding:12px 14px;border-right:1px solid var(--line)}
.chart:last-child{border-right:none}
.chart .ct{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.chart .ct b{font:600 16px var(--mono);color:var(--text)}
.chart svg{width:100%;height:110px;display:block;margin-top:6px}
.close{margin-left:auto;background:none;border:1px solid var(--line2);color:var(--muted);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px}
.close:hover{color:var(--text)}
footer{margin-top:20px;font-size:12px;color:var(--dim);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <g stroke="#e5315f" stroke-width="1.6" fill="none" opacity=".75">
          <line x1="16" y1="5" x2="6" y2="22"/><line x1="16" y1="5" x2="26" y2="22"/><line x1="6" y1="22" x2="26" y2="22"/>
          <line x1="16" y1="5" x2="16" y2="15"/><line x1="6" y1="22" x2="16" y2="15"/><line x1="26" y1="22" x2="16" y2="15"/>
        </g>
        <circle cx="16" cy="5" r="3.4" fill="#e5315f"/><circle cx="6" cy="22" r="3.4" fill="#e5315f"/>
        <circle cx="26" cy="22" r="3.4" fill="#e5315f"/><circle cx="16" cy="15" r="2.6" fill="#3fb950"/>
      </svg>
      PiMesh
    </div>
    <span class="pill">mesh <b id="meshName">…</b></span>
    <span class="pill">viewing from <b id="viewFrom">…</b></span>
    <span class="pill" id="secPill">…</span>
    <div class="spacer"></div>
    <div class="live" id="live"><span class="dot"></span><span id="liveTxt">connecting…</span></div>
  </header>

  <section class="kpis" id="kpis"></section>

  <section class="grid2">
    <div class="card">
      <h2>Mesh topology <span class="r" id="topoNote"></span></h2>
      <svg id="topo" viewBox="0 0 640 330" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="legend">
        <span><i style="background:var(--ok)"></i>&lt; 5 ms</span>
        <span><i style="background:var(--warn)"></i>5–20 ms</span>
        <span><i style="background:var(--bad)"></i>&gt; 20 ms</span>
        <span>♛ coordinator (auto-elected)</span>
      </div>
    </div>
    <div class="card">
      <h2>Activity <span class="r" id="evCount"></span></h2>
      <ul id="events"></ul>
    </div>
  </section>

  <section class="card">
    <h2>Members <span class="r">click a row for history</span></h2>
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th>Node</th><th>Address</th><th>CPU</th><th>Last 6 min</th><th>Temp</th>
          <th>Memory</th><th>Disk</th><th>Network ↓ / ↑</th><th>Uptime</th><th>Seen</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <section class="card" id="detail"></section>

  <footer id="foot"></footer>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let data = null, selected = null;
try { selected = localStorage.getItem("pimesh.sel"); } catch (e) {}

const fmtB = b => { if (b == null) return "–"; const u=["B","KB","MB","GB","TB"]; let i=0; while (b>=1024 && i<u.length-1){b/=1024;i++} return (b>=100||i===0?b.toFixed(0):b.toFixed(1))+" "+u[i]; };
const fmtR = b => fmtB(b) + "/s";
const fmtUp = s => { s=Math.floor(s||0); const d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60); return d? `${d}d ${h}h` : h? `${h}h ${m}m` : `${m}m`; };
const fmtAgo = s => s < 3 ? "now" : s < 60 ? `${Math.round(s)}s ago` : s < 3600 ? `${Math.round(s/60)}m ago` : `${Math.round(s/3600)}h ago`;
const clock = t => new Date(t*1000).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
const pct = (a,b) => b ? 100*a/b : 0;
const statusColor = s => ({online:"var(--ok)", stale:"var(--warn)", offline:"var(--off)"}[s] || "var(--off)");
const tempClass = t => t == null ? "" : t >= 75 ? "hot" : t >= 62 ? "warm" : "cool";
const loadColor = p => p >= 85 ? "var(--bad)" : p >= 60 ? "var(--warn)" : "var(--ok)";
const rttColor = ms => ms < 5 ? "var(--ok)" : ms < 20 ? "var(--warn)" : "var(--bad)";

function spark(vals, w, h, max, color, fill) {
  const v = vals.filter(x => x != null);
  if (v.length < 2) return `<svg width="${w}" height="${h}"></svg>`;
  const mx = max ?? Math.max(...v, 1), mn = 0;
  const step = w / (vals.length - 1);
  let d = "", started = false;
  vals.forEach((x, i) => { if (x == null) return; const y = h - 2 - (x - mn) / (mx - mn) * (h - 4); d += (started ? "L" : "M") + (i*step).toFixed(1) + "," + y.toFixed(1); started = true; });
  const area = fill ? `<path d="${d}L${w},${h}L0,${h}Z" fill="${color}" opacity=".12"/>` : "";
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${area}<path d="${d}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}

function bigChart(vals, max, unit, color) {
  const W = 400, H = 110;
  const v = vals.filter(x => x != null);
  const mx = max ?? Math.max(10, Math.ceil(Math.max(...v, 0) / 10) * 10 + 10);
  let grid = "";
  [0.25, 0.5, 0.75].forEach(f => { const y = H - f*H; grid += `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#1f2a37"/><text x="${W-2}" y="${y-3}" fill="#56627a" font-size="10" text-anchor="end" font-family="monospace">${Math.round(mx*f)}${unit}</text>`; });
  const inner = spark(vals, W, H, mx, color, true).replace(/^<svg[^>]*>|<\/svg>$/g, "");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}${inner}</svg>`;
}

function kpi(label, value, sub) { return `<div class="kpi"><div class="l">${label}</div><div class="v">${value}</div><div class="s">${sub}</div></div>`; }

function render() {
  const d = data, nodes = d.nodes;
  const me = nodes.find(n => n.self);
  const live = nodes.filter(n => n.status !== "offline");
  const on = nodes.filter(n => n.status === "online").length;
  const stale = nodes.filter(n => n.status === "stale").length;
  const off = nodes.length - live.length;
  const S = (k, arr=live) => arr.reduce((a, n) => a + (n.stats[k] || 0), 0);
  const cores = S("cores");
  const avgCpu = live.length ? live.reduce((a,n)=>a+n.stats.cpu*n.stats.cores,0)/Math.max(cores,1) : 0;
  const temps = live.filter(n => n.stats.temp != null);
  const hottest = temps.sort((a,b)=>b.stats.temp-a.stats.temp)[0];
  const links = []; const seenPair = {};
  live.forEach(n => Object.entries(n.links||{}).forEach(([o, ms]) => { const k=[n.id,o].sort().join(); if (!seenPair[k]) { seenPair[k]=[]; links.push(k);} seenPair[k].push(ms); }));
  const allMs = Object.values(seenPair).map(a => a.reduce((x,y)=>x+y,0)/a.length);
  const avgMs = allMs.length ? allMs.reduce((a,b)=>a+b,0)/allMs.length : null;

  $("#meshName").textContent = d.mesh;
  $("#viewFrom").textContent = me ? me.name : "?";
  $("#secPill").innerHTML = d.secured ? "🔒 <b>secured</b>" : "🔓 open mesh";
  document.title = `PiMesh · ${on}/${nodes.length} online`;

  $("#kpis").innerHTML =
    kpi("Members", `${live.length}<small> / ${nodes.length}</small>`, `${on} online · ${stale} stale · ${off} offline`) +
    kpi("Mesh CPU", `${avgCpu.toFixed(0)}<small>%</small>`, `${cores} cores across ${live.length} Pis`) +
    kpi("Memory", `${fmtB(S("mem_used"))}`, `of ${fmtB(S("mem_total"))} (${pct(S("mem_used"),S("mem_total")).toFixed(0)}%)`) +
    kpi("Storage", `${fmtB(S("disk_used"))}`, `of ${fmtB(S("disk_total"))} (${pct(S("disk_used"),S("disk_total")).toFixed(0)}%)`) +
    kpi("Hottest", hottest ? `<span class="${tempClass(hottest.stats.temp)}">${hottest.stats.temp.toFixed(1)}<small>°C</small></span>` : "–", hottest ? hottest.name : "no sensors") +
    kpi("Throughput", fmtR(S("rx_rate")+S("tx_rate")), `↓ ${fmtR(S("rx_rate"))} · ↑ ${fmtR(S("tx_rate"))}`) +
    kpi("Link latency", avgMs != null ? `${avgMs.toFixed(1)}<small> ms</small>` : "–", `${links.length} live links`);

  renderTopo(nodes, seenPair, d.coordinator);
  renderEvents(d.events);
  renderRows(nodes, d.coordinator);
  renderDetail();
  $("#foot").textContent = `PiMesh v${d.version} · node ${d.self_id} · dashboard on every member at :${me ? me.web : 8470}`;
}

function renderTopo(nodes, pairs, coord) {
  const W = 640, H = 330, cx = W/2, cy = H/2 + 4;
  const list = [...nodes].sort((a,b) => a.id.localeCompare(b.id));
  const R = list.length <= 1 ? 0 : Math.min(125, 60 + list.length * 12);
  const pos = {};
  list.forEach((n, i) => { const a = -Math.PI/2 + i * 2*Math.PI/list.length; pos[n.id] = [cx + R*Math.cos(a)*1.5, cy + R*Math.sin(a)]; });
  let edges = "", labels = "";
  Object.entries(pairs).forEach(([k, arr]) => {
    const [a, b] = k.split(","); if (!pos[a] || !pos[b]) return;
    const ms = arr.reduce((x,y)=>x+y,0)/arr.length;
    const na = nodes.find(n=>n.id===a), nb = nodes.find(n=>n.id===b);
    const weak = na.status !== "online" || nb.status !== "online";
    const [x1,y1] = pos[a], [x2,y2] = pos[b];
    const hl = selected && (a === selected || b === selected);
    edges += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${rttColor(ms)}" stroke-width="${hl?2.4:1.3}" opacity="${hl?0.95:selected?0.18:0.55}" ${weak?'stroke-dasharray="4 4"':''}/>`;
    if (hl || (!selected && list.length <= 5)) labels += `<text x="${(x1+x2)/2}" y="${(y1+y2)/2 - 4}" fill="#8693a4" font-size="10" text-anchor="middle" font-family="monospace" paint-order="stroke" stroke="#11171f" stroke-width="3">${ms.toFixed(1)}ms</text>`;
  });
  let dots = "";
  list.forEach(n => {
    const [x, y] = pos[n.id]; const c = statusColor(n.status);
    const sel = n.id === selected;
    dots += `<g style="cursor:pointer" onclick="pick('${n.id}')">
      ${sel?`<circle cx="${x}" cy="${y}" r="25" fill="none" stroke="#e5315f" stroke-width="2"/>`:""}
      <circle cx="${x}" cy="${y}" r="18" fill="${n.self?'#2a1520':'#151d27'}" stroke="${c}" stroke-width="2.5" ${n.status==='offline'?'stroke-dasharray="3 3"':''}/>
      <text x="${x}" y="${y+4}" text-anchor="middle" font-size="11" font-family="monospace" fill="${n.status==='offline'?'#56627a':'#e6edf3'}">${n.status==='offline'?'off':Math.round(n.stats.cpu)+'%'}</text>
      <text x="${x}" y="${y+34}" text-anchor="middle" font-size="12" fill="${n.status==='offline'?'#56627a':'#c9d3de'}" font-weight="600">${esc(n.name)}</text>
      ${n.id===coord?`<text x="${x}" y="${y-24}" text-anchor="middle" font-size="14" fill="#e3a325">♛</text>`:""}
    </g>`;
  });
  $("#topo").innerHTML = edges + labels + dots;
  $("#topoNote").textContent = `${list.length} node${list.length===1?"":"s"}`;
}

const evIcon = {join:["●","var(--ok)"], rejoin:["↻","var(--ok)"], leave:["○","var(--bad)"], stale:["◐","var(--warn)"], restart:["⟳","var(--info)"]};
function renderEvents(evs) {
  $("#evCount").textContent = `${evs.length} events`;
  if (!evs.length) { $("#events").innerHTML = `<div class="empty">Waiting for other Pis to say hello…</div>`; return; }
  $("#events").innerHTML = evs.map(e => { const [ic, col] = evIcon[e.kind] || ["•","var(--muted)"];
    return `<li><span class="t">${clock(e.t)}</span><span style="color:${col}">${ic}</span><span><b>${esc(e.name)}</b> <span class="m">${esc(e.msg)}</span></span></li>`; }).join("");
}

function renderRows(nodes, coord) {
  $("#rows").innerHTML = nodes.map(n => {
    const s = n.stats, mp = pct(s.mem_used, s.mem_total), dp = pct(s.disk_used, s.disk_total);
    const url = `http://${n.ip}:${n.web}/`;
    return `<tr class="${n.status} ${n.id===selected?'sel':''}" onclick="pick('${n.id}')">
      <td><div class="name"><span class="dot" style="background:${statusColor(n.status)}"></span>${esc(n.name)}
        ${n.self?'<span class="tag you">you</span>':''}${n.id===coord?'<span class="tag lead">♛ lead</span>':''}</div>
        <div class="sub">${esc((s.model||"").replace(" Model B","").replace(/ Rev [\d.]+$/,""))}</div></td>
      <td><a class="ip" href="${url}" onclick="event.stopPropagation()" target="_blank">${esc(n.ip)}</a><div class="sub">${esc(n.id)}</div></td>
      <td><div class="mono">${n.status==='offline'?'–':s.cpu.toFixed(0)+'%'}</div><div class="bar"><i style="width:${s.cpu}%;background:${loadColor(s.cpu)}"></i></div></td>
      <td>${spark(n.hist.cpu, 110, 26, 100, "#e5315f", true)}</td>
      <td class="mono ${tempClass(s.temp)}">${s.temp != null ? s.temp.toFixed(1)+"°C" : "–"}</td>
      <td><div class="mono">${fmtB(s.mem_used)} <span class="sub">/ ${fmtB(s.mem_total)}</span></div><div class="bar"><i style="width:${mp}%;background:${loadColor(mp)}"></i></div></td>
      <td><div class="mono">${dp.toFixed(0)}% <span class="sub">of ${fmtB(s.disk_total)}</span></div><div class="bar"><i style="width:${dp}%;background:${loadColor(dp)}"></i></div></td>
      <td class="mono">${fmtR(s.rx_rate)} <span class="sub">/</span> ${fmtR(s.tx_rate)}</td>
      <td class="mono">${fmtUp(s.uptime)}</td>
      <td class="mono" style="color:${statusColor(n.status)}">${fmtAgo(n.age)}</td>
    </tr>`;
  }).join("");
}

function renderDetail() {
  const el = $("#detail");
  const n = data && data.nodes.find(x => x.id === selected);
  if (!n) { el.classList.remove("show"); return; }
  const s = n.stats, last = a => { const v = a.filter(x=>x!=null); return v.length ? v[v.length-1] : null; };
  const lt = last(n.hist.temp), lm = last(n.hist.mem);
  const linkList = Object.entries(n.links||{}).map(([id,ms]) => { const o = data.nodes.find(x=>x.id===id); return o ? `${esc(o.name)} <span style="color:${rttColor(ms)}">${ms.toFixed(1)}ms</span>` : ""; }).filter(Boolean).join(" · ") || "none yet";
  el.innerHTML = `
    <div class="dhead">
      <div><div class="big"><span class="dot" style="background:${statusColor(n.status)};margin-right:8px"></span>${esc(n.name)}</div><div class="sub">${esc(s.model)}</div></div>
      <div class="facts">
        <div>OS<b>${esc(s.os)}</b></div><div>Kernel<b>${esc(s.kernel)}</b></div>
        <div>Load<b>${(s.load||[]).join(" ")}</b></div><div>Uptime<b>${fmtUp(s.uptime)}</b></div>
        <div>Traffic total<b>↓${fmtB(s.rx_total)} ↑${fmtB(s.tx_total)}</b></div>
        <div>Member since<b>${clock(n.first_seen)}</b></div>
      </div>
      <button class="close" onclick="pick(null)">Close</button>
    </div>
    <div class="charts">
      <div class="chart"><div class="ct">CPU <b>${s.cpu.toFixed(0)}%</b></div>${bigChart(n.hist.cpu, 100, "%", "#e5315f")}</div>
      <div class="chart"><div class="ct">Temperature <b class="${tempClass(lt)}">${lt!=null?lt.toFixed(1)+"°C":"–"}</b></div>${bigChart(n.hist.temp, 90, "°", "#e3a325")}</div>
      <div class="chart"><div class="ct">Memory <b>${lm!=null?lm.toFixed(0)+"%":"–"}</b></div>${bigChart(n.hist.mem, 100, "%", "#58a6ff")}</div>
    </div>
    <div class="sub" style="padding:10px 14px 14px">Links from this node: ${linkList}</div>`;
  el.classList.add("show");
}

function pick(id) {
  selected = (id && id !== selected) ? id : null;
  try { selected ? localStorage.setItem("pimesh.sel", selected) : localStorage.removeItem("pimesh.sel"); } catch (e) {}
  if (data) render();
  if (selected) setTimeout(() => $("#detail").scrollIntoView({behavior:"smooth", block:"nearest"}), 50);
}

async function tick() {
  try {
    const r = await fetch("api/mesh", {cache: "no-store"});
    data = await r.json();
    render();
    $("#live").classList.remove("down");
    $("#liveTxt").textContent = "live · " + clock(data.now);
  } catch (e) {
    $("#live").classList.add("down");
    $("#liveTxt").textContent = "dashboard disconnected – retrying";
  }
}
tick(); setInterval(tick, 2000);
</script>
</body>
</html>
