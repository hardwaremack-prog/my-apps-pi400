<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Circuit Lab 2.0 — advanced electronics</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1c1f26;
  --bench:#262a33;
  --panel:#20242c;
  --panel-line:#333947;
  --board:#e9e3d2;
  --board-line:#c9c0a6;
  --copper:#c17a4e;
  --amber:#e8a94f;
  --teal:#3fd8c4;
  --teal-dim:#2a5f58;
  --red:#e0665f;
  --ink:#eef0f2;
  --ink-dim:#a3aab5;
  --font-d:'Space Grotesk',sans-serif;
  --font-b:'Inter',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-b);overflow:hidden;}
button{font-family:var(--font-b);cursor:pointer;}
#app{display:grid;grid-template-columns:200px 1fr 260px;grid-template-rows:56px 1fr 64px;height:100vh;gap:1px;background:var(--panel-line);}
header{grid-column:1/4;background:var(--panel);display:flex;align-items:center;padding:0 18px;gap:14px;}
header h1{font-family:var(--font-d);font-size:19px;font-weight:700;margin:0;letter-spacing:.2px;}
header .sub{font-size:12px;color:var(--ink-dim);margin-left:-6px;}
header .spacer{flex:1;}
.iconbtn{background:#2b303b;border:1px solid var(--panel-line);color:var(--ink);border-radius:8px;padding:7px 12px;font-size:13px;display:flex;align-items:center;gap:6px;transition:background .15s;}
.iconbtn:hover{background:#333a48;}
.iconbtn.active{background:var(--teal-dim);border-color:var(--teal);color:#e9fffb;}

.pwrGauge{display:flex;align-items:center;gap:9px;background:#2b303b;border:1px solid var(--panel-line);border-radius:20px;padding:6px 14px 6px 12px;font-size:12.5px;color:var(--ink-dim);}
.pwrGauge .dot{width:11px;height:11px;border-radius:50%;background:#4a5058;box-shadow:inset 0 0 3px rgba(0,0,0,.6);transition:background .25s, box-shadow .25s;flex-shrink:0;}
.pwrGauge .dot.on{background:#3fe085;box-shadow:0 0 9px 3px rgba(63,224,133,.65);}
.pwrGauge .pwrLabel{min-width:64px;}
.pwrGauge .pwrReadout{font-variant-numeric:tabular-nums;border-left:1px solid var(--panel-line);padding-left:9px;}
.pwrGauge .pwrReadout b{color:var(--ink);font-weight:600;}

#palette{background:var(--panel);padding:14px 12px;overflow-y:auto;}
#palette h2{font-size:11px;text-transform:none;color:var(--ink-dim);margin:0 0 10px 2px;font-weight:600;letter-spacing:.3px;}
.part{background:#2b303b;border:1px solid var(--panel-line);border-radius:10px;padding:10px 8px;margin-bottom:8px;text-align:center;transition:transform .12s, background .12s;user-select:none;}
.part:hover{background:#333a48;transform:translateY(-1px);}
.part:active{transform:translateY(0px) scale(.97);}
.part svg{display:block;margin:0 auto 6px;}
.part .lbl{font-size:11.5px;color:var(--ink);font-weight:500;}
.part.locked{opacity:.35;pointer-events:none;}

#stage{position:relative;background:var(--bench);overflow:hidden;}
#stage::before{content:'';position:absolute;inset:0;background:
  radial-gradient(circle at 20% -10%, rgba(232,169,79,.08), transparent 45%),
  repeating-linear-gradient(90deg, rgba(255,255,255,.015) 0 1px, transparent 1px 34px);
  pointer-events:none;}
#boardWrap{position:absolute;inset:26px;display:flex;align-items:center;justify-content:center;perspective:1400px;touch-action:none;}
#board{position:relative;width:900px;height:520px;max-width:100%;background:var(--board);border-radius:16px;box-shadow:0 18px 40px rgba(0,0,0,.45), inset 0 0 0 6px #d7cfb6;transition:transform .5s cubic-bezier(.2,.7,.2,1);background-image:
  radial-gradient(circle, var(--board-line) 1.4px, transparent 1.4px);
  background-size:24px 24px;background-position:14px 14px;}
#board.tilted{transform:rotateX(28deg) rotateZ(-1deg) scale(.92);box-shadow:0 60px 70px rgba(0,0,0,.55);}
#board.pcbmode{background-color:#0d3d2f;background-image:radial-gradient(circle, rgba(255,215,140,.35) 1.6px, transparent 1.6px);box-shadow:0 18px 40px rgba(0,0,0,.5), inset 0 0 0 6px #082a20;}
#board.short{animation:shortflash .18s steps(1) 4;}
@keyframes shortflash{0%,100%{filter:none;}50%{filter:brightness(2.4) saturate(0);}}
#compLayer{position:absolute;inset:0;pointer-events:none;}
#pinLayer{position:absolute;inset:0;z-index:5;pointer-events:none;}
#boardSignature{position:absolute;right:14px;bottom:9px;font-family:var(--font-d);font-size:13px;font-style:italic;color:#8a836a;opacity:.75;pointer-events:none;z-index:1;letter-spacing:.5px;}
#board.pcbmode #boardSignature{color:#9fd9c0;}
svg#wireSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
svg#wireSvg .wire{pointer-events:none;}

.comp{position:absolute;user-select:none;pointer-events:auto;}
.comp .del{position:absolute;top:-9px;right:-9px;width:18px;height:18px;border-radius:50%;background:#3a1f1f;border:1px solid var(--red);color:#ffdada;font-size:11px;line-height:16px;text-align:center;display:none;cursor:pointer;}
.comp:hover .del{display:block;}
.body{width:100%;height:100%;position:relative;cursor:grab;}
.body:active{cursor:grabbing;}
.tag{position:absolute;left:50%;transform:translateX(-50%);bottom:-18px;font-size:10.5px;color:#5b5646;background:rgba(233,227,210,.9);padding:1px 5px;border-radius:5px;white-space:nowrap;}
#board.pcbmode .tag{color:#bfe9d8;background:rgba(13,61,47,.85);}

#pwrMeter{display:flex;align-items:center;gap:9px;background:#2b303b;border:1px solid var(--panel-line);border-radius:20px;padding:7px 15px;font-size:12.5px;color:var(--ink-dim);font-variant-numeric:tabular-nums;}
#pwrDot.on{background:#3fe085;box-shadow:0 0 9px 3px rgba(63,224,133,.65);}
#pwrDot.short{background:var(--red);box-shadow:0 0 9px 3px rgba(224,102,95,.65);}
#pwrText{color:var(--ink);font-weight:500;}

.polmark{position:absolute;font-family:var(--font-d);font-size:12px;font-weight:700;color:#6b6450;pointer-events:none;line-height:1;}
#board.pcbmode .polmark{color:#bfe9d8;}
.polmark.pos{color:#a34a2f;}
#board.pcbmode .polmark.pos{color:#ffd28a;}
.polmark.led-pol{color:#fff;text-shadow:0 0 2px rgba(0,0,0,.85), 0 0 1px #000;font-size:11px;z-index:2;}
.pin{position:absolute;width:12px;height:12px;margin-left:-6px;margin-top:-6px;border-radius:50%;background:#8a8367;border:2px solid #55503f;cursor:crosshair;z-index:6;pointer-events:auto;}
.pin:hover{background:var(--amber);border-color:#8a5a1f;transform:scale(1.25);}
.pin.connected{background:var(--copper);}
#board.pcbmode .pin{background:#d8b465;border-color:#8a6620;}

/* battery */
.battery{width:100%;height:100%;border-radius:8px;background:linear-gradient(180deg,#3a3f47,#23262c);box-shadow:inset 0 2px 3px rgba(255,255,255,.15), inset 0 -3px 6px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;color:#f3d488;font-family:var(--font-d);font-weight:700;font-size:15px;}
.battery .cap{position:absolute;top:8px;bottom:8px;width:8px;border-radius:3px;background:#555;}
.battery .cap.l{left:6px;} .battery .cap.r{right:6px;background:#c7783f;height:70%;top:15%;}
.battery .btypelabel{position:absolute;bottom:2px;left:8px;font-size:8px;font-weight:600;color:#8a95a3;letter-spacing:.5px;}
.battery .battLightInput{display:none;position:absolute;left:8px;right:8px;bottom:-8px;width:calc(100% - 16px);height:12px;accent-color:#ffd23d;}

/* resistor */
.resistor{width:100%;height:100%;display:flex;align-items:center;}
.resistor .band{position:absolute;left:14%;right:14%;height:11px;top:50%;margin-top:-5.5px;border-radius:6px;background:#d8b98a;box-shadow:inset 0 -3px 4px rgba(0,0,0,.25), inset 0 2px 2px rgba(255,255,255,.5);}
.resistor .stripe{position:absolute;top:50%;margin-top:-5.5px;width:5px;height:11px;}

/* led */
.led{width:100%;height:100%;position:relative;}
.led .dome{position:absolute;left:12%;right:12%;top:6%;bottom:26%;border-radius:50% 50% 46% 46%;box-shadow:inset -4px -6px 8px rgba(0,0,0,.35), inset 3px 4px 6px rgba(255,255,255,.4);transition:box-shadow .1s;}
.led .flat{position:absolute;left:2px;bottom:20%;width:6px;height:10px;background:#8a8367;border-radius:2px;}
.led .glow{position:absolute;left:50%;top:35%;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;pointer-events:none;opacity:0;filter:blur(9px);}
.led.burnt .dome{background:#4a4a4a!important;box-shadow:none!important;}
.led.burnt::after{content:'\26A0';position:absolute;left:50%;top:-14px;transform:translateX(-50%);color:#e0665f;font-size:16px;}

/* switch */
.switch{width:100%;height:100%;display:flex;align-items:center;padding:0 8px;}
.switch .base{position:absolute;left:8%;right:8%;top:35%;bottom:35%;background:#cfc6a8;border-radius:6px;box-shadow:inset 0 2px 3px rgba(0,0,0,.25);}
.switch .lever{position:absolute;left:20%;width:60%;height:6px;top:50%;margin-top:-3px;background:linear-gradient(90deg,#9a2f2f,#c94b4b);border-radius:4px;transform-origin:left center;transition:transform .18s ease;box-shadow:0 1px 3px rgba(0,0,0,.4);}
.switch .knob{position:absolute;left:calc(20% + 60% - 5px);top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:#e8d9a0;box-shadow:0 1px 2px rgba(0,0,0,.5);transition:left .18s ease;}

/* potentiometer */
.pot{width:100%;height:100%;position:relative;}
.pot .base{position:absolute;inset:6px 8px;background:#3e6b8a;border-radius:6px;box-shadow:inset 0 2px 3px rgba(0,0,0,.3);}
.pot input[type=range]{position:absolute;left:6px;right:6px;top:50%;width:calc(100% - 12px);margin-top:-8px;height:16px;accent-color:var(--amber);}

/* capacitor */
.cap-comp{width:100%;height:100%;position:relative;}
.cap-comp .plate{position:absolute;top:14%;bottom:14%;width:6px;background:#8a8367;border-radius:2px;}
.cap-comp .plate.l{left:44%;} .cap-comp .plate.r{right:44%;}
.cap-comp .fill{position:absolute;left:6px;right:6px;bottom:4px;height:5px;border-radius:3px;background:#33403a;overflow:hidden;}
.cap-comp .fill i{display:block;height:100%;width:0%;background:var(--amber);transition:width .1s linear;}
.cap-comp .capValInput{position:absolute;left:6px;right:6px;bottom:-8px;width:calc(100% - 12px);height:12px;accent-color:#8a8367;}
.cap-comp.burnt .plate{background:#2a1414!important;}
.cap-comp.burnt::after{content:'\26A0';position:absolute;left:50%;top:0;transform:translateX(-50%);color:#e0665f;font-size:16px;}

/* 555 */
.timer{width:100%;height:100%;background:#2a2d24;border-radius:5px;box-shadow:inset 0 0 0 2px #14150f;position:relative;}
.timer .notch{position:absolute;left:50%;top:-4px;width:16px;height:8px;margin-left:-8px;border-radius:0 0 8px 8px;background:#14150f;}
.timer .label{position:absolute;top:6px;left:0;right:0;text-align:center;font-family:var(--font-d);font-size:11px;color:#c8ff7a;}
.timer .indicator{position:absolute;right:10px;top:8px;width:9px;height:9px;border-radius:50%;background:#2a1414;}
.timer .sliders{position:absolute;left:6px;right:6px;bottom:6px;display:flex;flex-direction:column;gap:3px;}
.timer .sliders div{display:flex;align-items:center;gap:4px;font-size:9px;color:#9fb08a;}
.timer input[type=range]{flex:1;height:10px;accent-color:#9fd45a;}

/* push button */
.pushbtn{width:100%;height:100%;position:relative;}
.pushbtn .base{position:absolute;left:10%;right:10%;bottom:6px;top:40%;background:#cfc6a8;border-radius:6px;box-shadow:inset 0 2px 3px rgba(0,0,0,.25);}
.pushbtn .cap{position:absolute;left:50%;top:6px;width:34px;height:34px;margin-left:-17px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #e0827a, #a83f3f);box-shadow:0 3px 4px rgba(0,0,0,.4);transition:transform .08s, box-shadow .08s;}
.pushbtn.pressed .cap{transform:translateY(5px);box-shadow:0 1px 2px rgba(0,0,0,.4);}

/* buzzer */
.buzzer{width:100%;height:100%;position:relative;}
.buzzer .body{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 30%, #a39c7f, #6b6450);box-shadow:inset 0 -4px 6px rgba(0,0,0,.35), 0 2px 4px rgba(0,0,0,.4);}
.buzzer .hole{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#2a2d24;}
.buzzer .wave{position:absolute;top:50%;border:2px solid var(--teal);border-radius:50%;opacity:0;pointer-events:none;}
.buzzer .wave.w1{left:50%;width:36px;height:36px;margin:-18px 0 0 -18px;}
.buzzer .wave.w2{left:50%;width:52px;height:52px;margin:-26px 0 0 -26px;}
.buzzer.burnt .body{background:#4a4a4a!important;}
.buzzer.burnt::after{content:'\26A0';position:absolute;left:50%;top:-16px;transform:translateX(-50%);color:#e0665f;font-size:16px;}

/* transistor */
.transistor{width:100%;height:100%;position:relative;}
.transistor .can{position:absolute;left:14px;right:0;top:4px;bottom:4px;border-radius:50%;background:linear-gradient(135deg,#4a4f58,#25282e);box-shadow:inset -3px -4px 6px rgba(0,0,0,.4), inset 2px 3px 4px rgba(255,255,255,.15);}
.transistor .tab{position:absolute;left:14px;top:50%;width:6px;height:14px;margin-top:-7px;background:#25282e;}
.transistor .lead{position:absolute;background:#8a8367;}
.transistor.on .can{box-shadow:inset -3px -4px 6px rgba(0,0,0,.4), inset 2px 3px 4px rgba(255,255,255,.15), 0 0 8px 2px rgba(63,224,133,.55);}

/* photoresistor */
.ldr{width:100%;height:100%;position:relative;}
.ldr .base{position:absolute;left:8%;right:8%;top:20%;bottom:20%;background:#9fae4f;border-radius:6px;box-shadow:inset 0 2px 3px rgba(0,0,0,.25);}
.ldr .zigzag{position:absolute;left:14%;right:14%;top:50%;height:2px;background:repeating-linear-gradient(90deg,#5a6023 0 4px, transparent 4px 8px);}
.ldr input[type=range]{position:absolute;left:6px;right:6px;bottom:-2px;width:calc(100% - 12px);margin-top:0;height:14px;accent-color:#e8d97a;}
.ldr .sun{position:absolute;right:4px;top:-16px;font-size:11px;}
.ldr .moon{position:absolute;left:4px;top:-16px;font-size:11px;}

/* diode (generic rectifier) */
.diode{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;}
.diode .body{width:70%;height:22px;background:linear-gradient(180deg,#3a3a3a,#1c1c1c);border-radius:3px;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.4);}
.diode .band{position:absolute;right:8px;top:0;bottom:0;width:5px;background:#d8d0b8;}
.diode.burnt .body{background:#1a1a1a!important;} .diode.burnt .band{background:#3a1414!important;}
.diode.burnt::after{content:'\26A0';position:absolute;left:50%;top:-16px;transform:translateX(-50%);color:#e0665f;font-size:16px;}

/* bridge rectifier */
.bridge{width:100%;height:100%;position:relative;}
.bridge .can{position:absolute;inset:8px;background:linear-gradient(135deg,#3a3f47,#1c1e22);border-radius:6px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 2px 3px rgba(255,255,255,.1), 0 2px 4px rgba(0,0,0,.4);}
.bridge .can span{color:#e8a94f;font-size:20px;font-weight:700;}
.bridge .pinlbl{position:absolute;font-size:8px;color:#8a95a3;font-weight:600;}
.bridge .pinlbl.ac1{left:-2px;top:50%;margin-top:-4px;} .bridge .pinlbl.ac2{right:-4px;top:50%;margin-top:-4px;}
.bridge .pinlbl.dcp{left:50%;top:-14px;margin-left:-4px;color:#a34a2f;} .bridge .pinlbl.dcn{left:50%;bottom:-14px;margin-left:-6px;}
.bridge.burnt .can{background:#1a1a1a!important;}
.bridge.burnt::after{content:'\26A0';position:absolute;left:50%;top:-14px;transform:translateX(-50%);color:#e0665f;font-size:16px;}
.motor.burnt .body{background:#3a1a1a!important;box-shadow:none!important;}
.motor.burnt::after{content:'\26A0';position:absolute;left:50%;top:-16px;transform:translateX(-50%);color:#e0665f;font-size:16px;}

/* inductor */
.inductor{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
.inductor .coilwrap{width:80%;height:24px;background:repeating-linear-gradient(90deg,#8a8367 0 4px, transparent 4px 6px, #8a8367 6px 10px, transparent 10px 14px);border-radius:12px;box-shadow:inset 0 2px 3px rgba(0,0,0,.3);}

/* mosfet */
.mosfet{width:100%;height:100%;position:relative;}
.mosfet .can{position:absolute;left:12px;right:0;top:4px;bottom:4px;border-radius:8px;background:linear-gradient(135deg,#4a4f58,#25282e);box-shadow:inset -3px -4px 6px rgba(0,0,0,.4), inset 2px 3px 4px rgba(255,255,255,.15);}
.mosfet .tab{position:absolute;left:12px;top:50%;width:6px;height:16px;margin-top:-8px;background:#25282e;}
.mosfet.on .can{box-shadow:inset -3px -4px 6px rgba(0,0,0,.4), inset 2px 3px 4px rgba(255,255,255,.15), 0 0 8px 2px rgba(63,224,133,.55);}

/* relay */
.relay{width:100%;height:100%;position:relative;}
.relay .body{position:absolute;left:6px;right:30px;top:6px;bottom:6px;background:#3e4a54;border-radius:4px;box-shadow:inset 0 2px 3px rgba(0,0,0,.3);}
.relay .coilcore{position:absolute;inset:8px;border:2px solid #8a95a3;border-radius:3px;}
.relay .armature{position:absolute;right:14px;top:14px;width:18px;height:5px;background:#cfc6a8;border-radius:2px;transform-origin:right center;transition:transform .12s;}
.relay.closed .armature{transform:rotate(-18deg);}
.relay .pinlbl{position:absolute;font-size:8px;color:#8a95a3;font-weight:600;}
.relay .pinlbl.ca{left:4px;bottom:-14px;} .relay .pinlbl.ct{right:4px;bottom:-14px;}

/* motor */
.motor{width:100%;height:100%;position:relative;}
.motor .body{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%, #6b7280, #2a2d33);box-shadow:inset -4px -6px 8px rgba(0,0,0,.4), 0 2px 4px rgba(0,0,0,.4);}
.motor .rotor{position:absolute;left:50%;top:50%;width:70%;height:70%;margin:-35% 0 0 -35%;}
.motor .blade{position:absolute;left:50%;top:50%;width:6px;height:44%;margin-left:-3px;background:#e8a94f;border-radius:3px;transform-origin:center bottom;}
.motor .blade.b2{transform:rotate(90deg);}

#infoPanel{background:var(--panel);padding:16px;overflow-y:auto;}
#infoPanel h2{font-family:var(--font-d);font-size:16px;margin:0 0 4px;}
#infoPanel .desc{font-size:13px;color:var(--ink-dim);line-height:1.5;margin-bottom:12px;}
.goalbox{background:#2b303b;border:1px solid var(--panel-line);border-radius:10px;padding:10px 12px;margin-bottom:12px;}
.goalbox .gt{font-size:11px;color:var(--amber);font-weight:600;margin-bottom:4px;}
.goalbox .gd{font-size:12.5px;color:var(--ink);}
#status{font-size:13px;padding:9px 11px;border-radius:9px;background:#2b303b;border:1px solid var(--panel-line);margin-bottom:12px;min-height:18px;}
#status.win{background:#204a3d;border-color:var(--teal);color:#ccffee;}
#status.warn{background:#4a2020;border-color:var(--red);color:#ffd7d3;}
#readout{font-size:12px;color:var(--ink-dim);line-height:1.7;margin-bottom:12px;}
#readout b{color:var(--ink);}
.hintBtn{width:100%;background:#2b303b;border:1px solid var(--panel-line);color:var(--ink-dim);border-radius:8px;padding:8px;font-size:12px;margin-bottom:8px;}
.hintBtn:hover{color:var(--ink);}
#hintText{font-size:12px;color:var(--ink-dim);background:#20242c;border-left:3px solid var(--amber);padding:8px 10px;margin-bottom:10px;display:none;line-height:1.5;}

footer{grid-column:1/4;background:var(--panel);display:flex;align-items:center;gap:10px;padding:0 16px;overflow-x:auto;}
.lvlnode{flex-shrink:0;width:34px;height:34px;border-radius:50%;background:#2b303b;border:2px solid var(--panel-line);display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:13px;font-weight:600;color:var(--ink-dim);cursor:pointer;}
.lvlnode.done{background:var(--teal-dim);border-color:var(--teal);color:#daffff;}
.lvlnode.current{border-color:var(--amber);color:var(--amber);box-shadow:0 0 0 3px rgba(232,169,79,.2);}
.lvlnode.locked{opacity:.3;cursor:default;}
.lvltrack{position:relative;flex:1;height:2px;background:var(--panel-line);margin:0 -2px;min-width:16px;}

#toast{position:absolute;left:50%;top:18px;transform:translateX(-50%);background:#20242c;border:1px solid var(--teal);color:#e6fffa;padding:8px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;z-index:50;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(4px);}

#schemOverlay{position:fixed;inset:0;background:rgba(10,11,14,.72);z-index:100;display:none;align-items:center;justify-content:center;}

/* ---------------- audio ---------------- */
let actx=null, humOsc=null, humGain=null;
function ensureAudio(){
  if(actx) return;
  actx = new (window.AudioContext||window.webkitAudioContext)();
  humOsc = actx.createOscillator(); humOsc.type='sine'; humOsc.frequency.value=90;
  humGain = actx.createGain(); humGain.gain.value=0;
  humOsc.connect(humGain).connect(actx.destination); humOsc.start();
}
function blip(freq=600, dur=0.07, type='sine', vol=0.12){
  if(state.muted) return; ensureAudio();
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.value=vol; g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+dur);
  o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+dur+0.02);
}
function chime(){
  if(state.muted) return; ensureAudio();
  [523,659,784,1047].forEach((f,i)=> setTimeout(()=>blip(f,0.18,'triangle',0.1), i*90));
}
function buzz(){ blip(90,0.35,'sawtooth',0.16); }
function setHum(current){
  if(!actx) return;
  const target = state.muted?0:Math.min(0.11, Math.abs(current)*3.2);
  humGain.gain.setTargetAtTime(target, actx.currentTime, 0.08);
  humOsc.frequency.setTargetAtTime(70+Math.min(120,Math.abs(current)*900), actx.currentTime, 0.1);
}
function setBuzzerTone(c, active, current){
  if(active) ensureAudio();
  if(!actx) return;
  if(!c._buzzOsc){
    c._buzzOsc = actx.createOscillator(); c._buzzOsc.type='square'; c._buzzOsc.frequency.value=440;
    c._buzzGain = actx.createGain(); c._buzzGain.gain.value=0;
    c._buzzOsc.connect(c._buzzGain).connect(actx.destination); c._buzzOsc.start();
  }
  const target = (active && !state.muted) ? Math.min(0.09, 0.03+current*1.5) : 0;
  c._buzzGain.gain.setTargetAtTime(target, actx.currentTime, 0.02);
}

/* ---------------- helpers ---------------- */
function toast(msg, duration){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'), duration||2200);
}
function burnOut(c, message){
  if(c.props.burnt) return;
  c.props.burnt = true;
  buzz();
  toast(message, 5000);
}
function pinKey(compId,pinId){ return compId+':'+pinId; }
function gaussSolve(A,b){
  const n=b.length;
  for(let i=0;i<n;i++){
    let piv=i;
    for(let r=i+1;r<n;r++) if(Math.abs(A[r][i])>Math.abs(A[piv][i])) piv=r;
    if(piv!==i){ [A[i],A[piv]]=[A[piv],A[i]]; [b[i],b[piv]]=[b[piv],b[i]]; }
    if(Math.abs(A[i][i])<1e-12) continue;
    for(let r=i+1;r<n;r++){
      const f=A[r][i]/A[i][i];
      if(f===0) continue;
      for(let c=i;c<n;c++) A[r][c]-=f*A[i][c];
      b[r]-=f*b[i];
    }
  }
  const x=new Array(n).fill(0);
  for(let i=n-1;i>=0;i--){
    let s=b[i];
    for(let c=i+1;c<n;c++) s-=A[i][c]*x[c];
    x[i]= Math.abs(A[i][i])<1e-12 ? 0 : s/A[i][i];
  }
  return x;
}

  const props = {
    battery:{v:9, typeIdx:1, light:70},
    resistor:{r:220},
    led:{colorIdx:0, burnt:false},
    switch:{closed:false},
    pot:{r:2000},
    cap:{c:0.02, vprev:0, typeIdx:2, burnt:false},
    timer555:{r1:8000,r2:8000,c:0.00002, state555:true, tAcc:0, vccLast:9, gndLast:0},
    pushbtn:{closed:false},
    buzzer:{burnt:false},
    transistor:{on:false},
    ldr:{light:50},
    diode:{burnt:false},
    bridge:{burnt:false},
    inductor:{l:70, iprev:0},
    mosfet:{on:false},
    relay:{coilCurrentPrev:0, closed:false},

  }[type];
  base.props=props;
  return base;
}

/* ---------------- rendering ---------------- */
const compLayer=document.getElementById('compLayer');
const pinLayer=document.getElementById('pinLayer');
const wireSvg=document.getElementById('wireSvg');
const board=document.getElementById('board');

function addComponent(type){
  const c=makeComponent(type);
  state.components.push(c);
  buildComponentDom(c);
  return c;
}
function removeComponent(c){
  state.wires = state.wires.filter(w=>{
    const hit = w.a.split(':')[0]===c.id || w.b.split(':')[0]===c.id;
    if(hit){ if(w._dom) w._dom.remove(); if(w._flow) w._flow.remove(); if(w._hit) w._hit.remove(); if(w._viaMarkers) w._viaMarkers.forEach(r=>r.remove()); }
    return !hit;
  });
  c._dom.remove();
  Object.values(c._pins).forEach(p=>p.remove());
  state.components = state.components.filter(x=>x!==c);
}

function buildComponentDom(c){
  const def=COMP_TYPES[c.type];
  const el=document.createElement('div');
  el.className='comp';
  el.style.width=def.w+'px'; el.style.height=def.h+'px';
  const body=document.createElement('div'); body.className='body';
  body.appendChild(buildInner(c));
  const del=document.createElement('div'); del.className='del'; del.textContent='×';
  del.onclick=(e)=>{ e.stopPropagation(); removeComponent(c); };
  el.appendChild(body); el.appendChild(del);
  const tag=document.createElement('div'); tag.className='tag'; tag.textContent=tagText(c);
  el.appendChild(tag); c._tag=tag;
  compLayer.appendChild(el);
  c._dom=el; c._body=body;

  // drag
  let dragging=false, sx=0, sy=0, ox=0, oy=0, moved=0;
  body.style.touchAction='none';
  body.addEventListener('pointerdown',(e)=>{
    if(e.target.tagName==='INPUT') return;
    dragging=true; moved=0; sx=e.clientX; sy=e.clientY; ox=c.x; oy=c.y;
    try{ body.setPointerCapture(e.pointerId); }catch(err){}
    if(c.type==='pushbtn'){ c.props.closed=true; if(c._domEls&&c._domEls.root) c._domEls.root.classList.add('pressed'); c._tag.textContent=tagText(c); blip(700,0.04,'square',0.06); }
    e.preventDefault();
  });
  body.addEventListener('pointermove',(e)=>{
    if(!dragging) return;
    const rect=board.getBoundingClientRect();
    const scale = rect.width/board.offsetWidth;
    c.x = Math.max(4, Math.min(board.offsetWidth-def.w-4, ox+(e.clientX-sx)/scale));
    c.y = Math.max(4, Math.min(board.offsetHeight-def.h-4, oy+(e.clientY-sy)/scale));
    moved = Math.max(moved, Math.hypot(e.clientX-sx, e.clientY-sy));
  });
  body.addEventListener('pointerup',(e)=>{
    const wasDragging=dragging;
    dragging=false;
    try{ body.releasePointerCapture(e.pointerId); }catch(err){}
    if(c.type==='pushbtn'){ c.props.closed=false; if(c._domEls&&c._domEls.root) c._domEls.root.classList.remove('pressed'); c._tag.textContent=tagText(c); }
    // pointer capture retargets the browser's native click away from nested
    // elements, so a clean tap (negligible movement) is detected here instead
    if(wasDragging && moved<6 && c._onTap) c._onTap();
  });
  body.addEventListener('pointercancel',()=>{
    dragging=false;
    if(c.type==='pushbtn'){ c.props.closed=false; if(c._domEls&&c._domEls.root) c._domEls.root.classList.remove('pressed'); c._tag.textContent=tagText(c); }
  });

  // pins
  c._pins={};
  def.pins.forEach(p=>{
    const pd=document.createElement('div'); pd.className='pin';
    pd.title=p.id;
    pinLayer.appendChild(pd);
    c._pins[p.id]=pd;
    pd.style.touchAction='none';
    pd.addEventListener('pointerdown',(e)=>{
      e.stopPropagation(); e.preventDefault();
      startWire(pinKey(c.id,p.id));
    });
    pd.addEventListener('pointerup',(e)=>{
      e.stopPropagation();
      if(state.wiring) finishWire(pinKey(c.id,p.id));
    });
  });
}
function capValueLabel(farads){
  if(farads>=1) return farads.toFixed(farads>=10?0:1)+'F';
  if(farads>=0.001) return Math.round(farads*1e6)+'\u00b5F';
  if(farads>=0.000001) return Math.round(farads*1e9)+'nF';
  return Math.round(farads*1e12)+'pF';
}
function tagText(c){
  if(c.type==='battery') return BATTERY_TYPES[c.props.typeIdx].label+' '+c.props.v+'V';
  if(c.type==='resistor') return c.props.r>=1000? (c.props.r/1000)+'k\u03A9' : c.props.r+'\u03A9';
  if(c.type==='led') return LED_COLORS[c.props.colorIdx].name;
  if(c.type==='switch') return c.props.closed?'closed':'open';
  if(c.type==='pot') return Math.round(c.props.r)+'\u03A9';
  if(c.type==='cap') return CAP_TYPES[c.props.typeIdx].abbr+' '+capValueLabel(c.props.c);
  if(c.type==='timer555') return '555';
  if(c.type==='pushbtn') return c.props.closed?'pressed':'button';
  if(c.type==='buzzer') return c.props.burnt?'blown':'buzzer';
  if(c.type==='transistor') return 'NPN '+(c.props.on?'(on)':'(off)');
  if(c.type==='ldr') return c.props.light+'% light';
  return '';
}

function applySwitchVisual(c){
  if(!c._domEls) return;
  c._domEls.lever.style.transform = c.props.closed? 'rotate(0deg)' : 'rotate(-32deg)';
  c._domEls.knob.style.left = c.props.closed? 'calc(20% + 60% - 5px)' : 'calc(20% + 44% - 5px)';
}
function refreshBatteryVisual(c){
  if(!c._domEls) return;
  const bt=BATTERY_TYPES[c.props.typeIdx];
  c._domEls.typelabel.textContent = bt.id;
  const isSolar = bt.id==='SOLAR';
  c._domEls.lightInput.style.display = isSolar ? 'block' : 'none';
  c._domEls.vlabel.textContent = (bt.id==='AC' ? '~' : '') + (bt.id==='SOLAR' ? (bt.v*(c.props.light/100)).toFixed(1) : c.props.v) + 'V';
}
function refreshCapVisual(c){
  if(!c._domEls) return;
  const ct=CAP_TYPES[c.props.typeIdx];
  c._domEls.plus.style.display = ct.polarized ? 'block' : 'none';
  c._domEls.root.classList.toggle('burnt', !!c.props.burnt);
}

/* wiring interaction */
let previewLine=null;
function boardLocalFromEvent(e){
  const rect=board.getBoundingClientRect();
  return {
    x:(e.clientX-rect.left)*(board.offsetWidth/rect.width),
    y:(e.clientY-rect.top)*(board.offsetHeight/rect.height)
  };
}
function pinPos(key){
  const [cid,pid]=key.split(':');
  const c=state.components.find(x=>x.id===cid);
  if(!c) return null;
  const pin=COMP_TYPES[c.type].pins.find(p=>p.id===pid);
  return {x:c.x+pin.dx, y:c.y+pin.dy};
}
// Builds the full ordered point list for a trace from pa to pb.
// Manual waypoints (added by clicking the board while wiring) always win.
// With no manual waypoints, PCB mode auto-bends into a right-angle trace;
// breadboard mode stays a straight jumper wire.
function routePoints(pa, pb, waypoints){
  if(waypoints && waypoints.length) return [pa, ...waypoints, pb];
  if(state.pcb){
    const dx=Math.abs(pb.x-pa.x), dy=Math.abs(pb.y-pa.y);
    const bend = dx>=dy ? {x:pb.x,y:pa.y} : {x:pa.x,y:pb.y};
    return [pa, bend, pb];
  }
  return [pa, pb];
}
function pointsAttr(pts){ return pts.map(p=>p.x+','+p.y).join(' '); }
function startWire(key){
  state.wiring=key;
  state.wiringPoints=[];
  previewLine = document.createElementNS('http://www.w3.org/2000/svg','polyline');
  previewLine.setAttribute('fill','none');
  previewLine.setAttribute('stroke','#e8a94f'); previewLine.setAttribute('stroke-width','2.5');
  previewLine.setAttribute('stroke-dasharray','5 4');
  wireSvg.appendChild(previewLine);
  window.addEventListener('pointermove', movePreview);
}
function movePreview(e){
  if(!state.wiring||!previewLine) return;
  const start=pinPos(state.wiring);
  const cur=boardLocalFromEvent(e);
  previewLine.setAttribute('points', pointsAttr([start, ...state.wiringPoints, cur]));
}
// Clicking empty board space while a wire is in progress drops a manual bend point.
function boardClickForWaypoint(e){
  if(!state.wiring) return;
  if(e.target!==board) return;
  const pt=boardLocalFromEvent(e);
  state.wiringPoints.push(pt);
  blip(500,0.03,'square',0.05);
}
function makeWire(a,b,silent,waypoints){
  const exists = state.wires.some(w=> (w.a===a&&w.b===b)||(w.a===b&&w.b===a));
  if(exists || a===b) return null;
  const w={a,b,points:waypoints||[]};
  const line=document.createElementNS('http://www.w3.org/2000/svg','polyline');
  line.setAttribute('class','wire'); line.setAttribute('fill','none');
  line.setAttribute('stroke', state.pcb? '#e8b45a':'#3a7f74');
  line.setAttribute('stroke-width', state.pcb? '6':'4');
  line.setAttribute('stroke-linecap','round'); line.setAttribute('stroke-linejoin','round');
  line.setAttribute('pointer-events','none');
  const flow=document.createElementNS('http://www.w3.org/2000/svg','polyline');
  flow.setAttribute('fill','none');
  flow.setAttribute('stroke','#bffff2'); flow.setAttribute('stroke-width','2');
  flow.setAttribute('stroke-dasharray','6 8'); flow.setAttribute('stroke-linecap','round'); flow.setAttribute('stroke-linejoin','round'); flow.style.opacity=0;
  flow.setAttribute('pointer-events','none');
  const hit=document.createElementNS('http://www.w3.org/2000/svg','polyline');
  hit.setAttribute('fill','none');
  hit.setAttribute('stroke','transparent'); hit.setAttribute('stroke-width','20');
  hit.setAttribute('stroke-linecap','round'); hit.setAttribute('stroke-linejoin','round'); hit.style.cursor='pointer';
  hit.setAttribute('pointer-events','stroke');
  wireSvg.appendChild(line); wireSvg.appendChild(flow); wireSvg.appendChild(hit);
  hit.addEventListener('mouseenter',()=>{ line.setAttribute('stroke', '#e0665f'); });
  hit.addEventListener('mouseleave',()=>{ line.setAttribute('stroke', state.pcb? '#e8b45a':'#3a7f74'); });
  hit.onclick=()=>{ line.remove(); flow.remove(); hit.remove(); if(w._viaMarkers) w._viaMarkers.forEach(r=>r.remove()); state.wires=state.wires.filter(x=>x!==w); blip(300,0.05,'square',0.08); };
  w._dom=line; w._flow=flow; w._hit=hit;
  state.wires.push(w);
  if(!silent) blip(850,0.06,'sine',0.1);
  return w;
}
function finishWire(key){
  window.removeEventListener('pointermove', movePreview);
  if(previewLine){ previewLine.remove(); previewLine=null; }
  const a=state.wiring; const pts=state.wiringPoints||[];
  state.wiring=null; state.wiringPoints=[];
  if(!a || a===key) return;
  makeWire(a,key,false,pts);
}
window.addEventListener('pointerup',(e)=>{
  if(!state.wiring) return;
  if(e.target===board){ boardClickForWaypoint(e); return; }
  window.removeEventListener('pointermove', movePreview);
  if(previewLine){ previewLine.remove(); previewLine=null; }
  state.wiring=null; state.wiringPoints=[];
});
window.addEventListener('keydown',(e)=>{
  if(e.key==='Escape' && state.wiring){
    window.removeEventListener('pointermove', movePreview);
    if(previewLine){ previewLine.remove(); previewLine=null; }
    state.wiring=null; state.wiringPoints=[];
  }
});

function updateWireGeometry(){
  const posOf=pinPos;
  state.wires.forEach(w=>{
    const pa=posOf(w.a), pb=posOf(w.b);
    if(!pa||!pb) return;
    const pts=routePoints(pa,pb,w.points);
    const attr=pointsAttr(pts);
    w._dom.setAttribute('points', attr);
    w._flow.setAttribute('points', attr);
    if(w._hit) w._hit.setAttribute('points', attr);
    // via markers at manual waypoints (PCB mode only)
    if(state.pcb && w.points && w.points.length){
      if(!w._viaMarkers) w._viaMarkers=[];
      while(w._viaMarkers.length < w.points.length){
        const ring=document.createElementNS('http://www.w3.org/2000/svg','circle');
        ring.setAttribute('r','6'); ring.setAttribute('fill','#0d3d2f'); ring.setAttribute('stroke','#4d9dff'); ring.setAttribute('stroke-width','2.5');
        ring.setAttribute('pointer-events','none');
        wireSvg.appendChild(ring);
        w._viaMarkers.push(ring);
      }
      while(w._viaMarkers.length > w.points.length){ w._viaMarkers.pop().remove(); }
      w.points.forEach((p,i)=>{ w._viaMarkers[i].setAttribute('cx',p.x); w._viaMarkers[i].setAttribute('cy',p.y); });
    } else if(w._viaMarkers){
      w._viaMarkers.forEach(r=>r.remove()); w._viaMarkers=[];
    }
  });
  state.components.forEach(c=>{
    c._dom.style.left=c.x+'px'; c._dom.style.top=c.y+'px';
    Object.entries(c._pins).forEach(([pid,dom])=>{
      const pin=COMP_TYPES[c.type].pins.find(p=>p.id===pid);
      dom.style.left=(c.x+pin.dx)+'px'; dom.style.top=(c.y+pin.dy)+'px';
    });
  });
}

/* ---------------- shared topology helper ---------------- */
function computeGroups(comps, wires){
  const parent={};
  function findC(x){ let r=x; while(parent[r]!==r) r=parent[r]; while(parent[x]!==r){ const nx=parent[x]; parent[x]=r; x=nx;} return r; }
  function union(a,b){ a=findC(a); b=findC(b); if(a!==b) parent[a]=b; }
  comps.forEach(c=> COMP_TYPES[c.type].pins.forEach(p=> parent[pinKey(c.id,p.id)]=pinKey(c.id,p.id)));
  wires.forEach(w=>{ if(parent[w.a]!==undefined && parent[w.b]!==undefined) union(w.a,w.b); });
  const groupOf={}; let ng=0;
  function gidOf(key){ const r=findC(key); if(!(r in groupOf)) groupOf[r]=ng++; return groupOf[r]; }
  comps.forEach(c=> COMP_TYPES[c.type].pins.forEach(p=> gidOf(pinKey(c.id,p.id))));
  return {gidOf, N:ng};
}

/* ---------------- simulation ---------------- */
let lastT=performance.now();
function simulateStep(dt){
  const comps=state.components, wires=state.wires;
  const {gidOf, N} = computeGroups(comps, wires);
  if(N===0) return {leds:[], current:0};
  const fixedV=new Array(N).fill(null);
  comps.filter(c=>c.type==='battery').forEach(c=>{
    const gN=gidOf(pinKey(c.id,'neg')), gP=gidOf(pinKey(c.id,'pos'));
    if(fixedV[gN]==null) fixedV[gN]=0;
    const bt=BATTERY_TYPES[c.props.typeIdx];
    let v = c.props.v;
    if(bt.id==='SOLAR') v = bt.v * ((c.props.light||0)/100);
    else if(bt.id==='AC') v = bt.v * Math.sin(2*Math.PI*0.5*(state.simClock||0));
    fixedV[gP] = v;
  });
  comps.filter(c=>c.type==='timer555').forEach(c=>{
    const gOut=gidOf(pinKey(c.id,'out'));
    fixedV[gOut] = c.props.state555 ? (c.props.vccLast||9) : (c.props.gndLast||0);
  });

  const branches=[];
  comps.forEach(c=>{
    if(c.type==='resistor') branches.push({u:gidOf(pinKey(c.id,'a')),v:gidOf(pinKey(c.id,'b')),G:1/c.props.r,Vsrc:0,ref:c,kind:'r'});
    else if(c.type==='switch') branches.push({u:gidOf(pinKey(c.id,'a')),v:gidOf(pinKey(c.id,'b')),G: c.props.closed? (1/0.4):1e-9, Vsrc:0, ref:c, kind:'sw'});
    else if(c.type==='pot') branches.push({u:gidOf(pinKey(c.id,'a')),v:gidOf(pinKey(c.id,'b')),G:1/Math.max(c.props.r,15),Vsrc:0,ref:c,kind:'pot'});
    else if(c.type==='pushbtn') branches.push({u:gidOf(pinKey(c.id,'a')),v:gidOf(pinKey(c.id,'b')),G: c.props.closed? (1/0.4):1e-9, Vsrc:0, ref:c, kind:'pushbtn'});
    else if(c.type==='ldr'){
      const R = 500000 - (c.props.light/100)*(500000-500);
      branches.push({u:gidOf(pinKey(c.id,'a')),v:gidOf(pinKey(c.id,'b')),G:1/Math.max(R,500),Vsrc:0,ref:c,kind:'ldr'});
    }
    else if(c.type==='buzzer' && !c.props.burnt) branches.push({u:gidOf(pinKey(c.id,'a')),v:gidOf(pinKey(c.id,'b')),G:1/40,Vsrc:0,ref:c,kind:'buzzer'});
    else if(c.type==='motor' && !c.props.burnt) branches.push({u:gidOf(pinKey(c.id,'a')),v:gidOf(pinKey(c.id,'b')),G:1/30,Vsrc:0,ref:c,kind:'motor'});
    else if(c.type==='cap' && !c.props.burnt){
      const Geq=c.props.c/dt;
      branches.push({u:gidOf(pinKey(c.id,'a')),v:gidOf(pinKey(c.id,'b')),G:Geq,Vsrc:c.props.vprev||0,ref:c,kind:'cap'});
    }
    else if(c.type==='inductor'){
      const Geq=dt/Math.max(c.props.l,0.001);
      const Vsrc=-(c.props.iprev||0)*Math.max(c.props.l,0.001)/dt;
      branches.push({u:gidOf(pinKey(c.id,'a')),v:gidOf(pinKey(c.id,'b')),G:Geq,Vsrc,ref:c,kind:'inductor'});
    }
    else if(c.type==='transistor'){
      // built-in base pull-down: keeps the base defined (off) when its driving switch is open,
      // same role a real circuit gives a pull-down resistor
      branches.push({u:gidOf(pinKey(c.id,'base')),v:gidOf(pinKey(c.id,'emitter')),G:1/10000,Vsrc:0,ref:c,kind:'trans-bleed'});
    }
    else if(c.type==='mosfet'){
      branches.push({u:gidOf(pinKey(c.id,'gate')),v:gidOf(pinKey(c.id,'source')),G:1/1000000,Vsrc:0,ref:c,kind:'mosfet-bleed'});
    }
    else if(c.type==='relay'){
      branches.push({u:gidOf(pinKey(c.id,'coilA')),v:gidOf(pinKey(c.id,'coilB')),G:1/400,Vsrc:0,ref:c,kind:'relay-coil'});
      const closed = Math.abs(c.props.coilCurrentPrev||0) > 0.01;
      c.props.closed = closed;
      branches.push({u:gidOf(pinKey(c.id,'ctA')),v:gidOf(pinKey(c.id,'ctB')),G: closed?(1/0.3):1e-9, Vsrc:0, ref:c, kind:'relay-contact'});
    }
  });

  const ledInfo = comps.filter(c=>c.type==='led' && !c.props.burnt).map(c=>({
    c, u:gidOf(pinKey(c.id,'anode')), v:gidOf(pinKey(c.id,'cathode')), on:false, vf:LED_COLORS[c.props.colorIdx].vf, ron:18
  }));
  const diodeInfo = comps.filter(c=>c.type==='diode' && !c.props.burnt).map(c=>({
    c, u:gidOf(pinKey(c.id,'anode')), v:gidOf(pinKey(c.id,'cathode')), on:false, vf:0.7, ron:4
  }));
  const bridgeInfo=[];
  comps.filter(c=>c.type==='bridge' && !c.props.burnt).forEach(c=>{
    const ac1=gidOf(pinKey(c.id,'ac1')), ac2=gidOf(pinKey(c.id,'ac2')), dcp=gidOf(pinKey(c.id,'dcpos')), dcn=gidOf(pinKey(c.id,'dcneg'));
    bridgeInfo.push({c, u:ac1, v:dcp, on:false, vf:0.7, ron:4});
    bridgeInfo.push({c, u:ac2, v:dcp, on:false, vf:0.7, ron:4});
    bridgeInfo.push({c, u:dcn, v:ac1, on:false, vf:0.7, ron:4});
    bridgeInfo.push({c, u:dcn, v:ac2, on:false, vf:0.7, ron:4});
  });
  const diodeLike = ledInfo.concat(diodeInfo).concat(bridgeInfo);
  const transInfo = comps.filter(c=>c.type==='transistor').map(c=>({
    c, ub:gidOf(pinKey(c.id,'base')), uc:gidOf(pinKey(c.id,'collector')), ue:gidOf(pinKey(c.id,'emitter')), on:false
  }));
  const mosfetInfo = comps.filter(c=>c.type==='mosfet').map(c=>({
    c, ug:gidOf(pinKey(c.id,'gate')), ud:gidOf(pinKey(c.id,'drain')), us:gidOf(pinKey(c.id,'source')), on:false
  }));

  function solveOnce(extra){
    const all=branches.concat(extra);
    const A=Array.from({length:N},()=>new Array(N).fill(0));
    const b=new Array(N).fill(0);
    for(let i=0;i<N;i++) A[i][i]+=1e-9;
    function stamp(u,v,G,Vsrc){
      const uf=fixedV[u]!=null, vf=fixedV[v]!=null;
      if(!uf){ A[u][u]+=G; if(!vf) A[u][v]-=G; else b[u]+=G*fixedV[v]; b[u]+=G*Vsrc; }
      if(!vf){ A[v][v]+=G; if(!uf) A[v][u]-=G; else b[v]+=G*fixedV[u]; b[v]-=G*Vsrc; }
    }
    all.forEach(br=>stamp(br.u,br.v,br.G,br.Vsrc));
    for(let i=0;i<N;i++) if(fixedV[i]!=null){ A[i]=new Array(N).fill(0); A[i][i]=1; b[i]=fixedV[i]; }
    return gaussSolve(A,b);
  }
  const VBE=0.65, RonBE=1000, RonCE=6, VGS_TH=2.0, RonDS=4;
  let V=solveOnce(diodeLike.map(d=>({u:d.u,v:d.v,G:1e-9,Vsrc:0})));
  for(let iter=0; iter<10; iter++){
    let changed=false;
    const extraDiode=diodeLike.map(d=>{
      const across=V[d.u]-V[d.v];
      const shouldOn = across > d.vf*0.97;
      if(shouldOn!==d.on){ d.on=shouldOn; changed=true; }
      return d.on? {u:d.u,v:d.v,G:1/d.ron,Vsrc:d.vf} : {u:d.u,v:d.v,G:1e-9,Vsrc:0};
    });
    const extraTrans=[];
    transInfo.forEach(t=>{
      const vbe=V[t.ub]-V[t.ue];
      const shouldOn = vbe > VBE*0.97;
      if(shouldOn!==t.on){ t.on=shouldOn; changed=true; }
      extraTrans.push(t.on? {u:t.ub,v:t.ue,G:1/RonBE,Vsrc:VBE} : {u:t.ub,v:t.ue,G:1e-9,Vsrc:0});
      extraTrans.push(t.on? {u:t.uc,v:t.ue,G:1/RonCE,Vsrc:0} : {u:t.uc,v:t.ue,G:1e-9,Vsrc:0});
    });
    const extraMosfet=[];
    mosfetInfo.forEach(m=>{
      const vgs=V[m.ug]-V[m.us];
      const shouldOn = vgs > VGS_TH*0.97;
      if(shouldOn!==m.on){ m.on=shouldOn; changed=true; }
      extraMosfet.push(m.on? {u:m.ud,v:m.us,G:1/RonDS,Vsrc:0} : {u:m.ud,v:m.us,G:1e-9,Vsrc:0});
    });
    V=solveOnce(extraDiode.concat(extraTrans).concat(extraMosfet));
    if(!changed) break;
  }
  transInfo.forEach(t=>{ t.c.props.on = t.on; });
  mosfetInfo.forEach(m=>{ m.c.props.on = m.on; });
  function branchCurrent(u,v,G,Vsrc){ return G*(V[u]-V[v]-Vsrc); }

  // update caps: track voltage for next frame's companion source, pop polarized types on reverse bias
  comps.forEach(c=>{
    if(c.type==='cap' && !c.props.burnt){
      const vNow = V[gidOf(pinKey(c.id,'a'))]-V[gidOf(pinKey(c.id,'b'))];
      const ct=CAP_TYPES[c.props.typeIdx];
      if(ct.polarized && vNow < -0.3){ burnOut(c, '\uD83D\uDCA5 Capacitor popped \u2014 wired backwards! '+ct.label+' capacitors are polarized: the + lead needs to be the higher-voltage side. Delete it and wire a fresh one in the right way round.'); }
      c.props.vprev = vNow;
    }
  });
  // update inductors: backward-Euler current state
  comps.forEach(c=>{
    if(c.type==='inductor'){
      const Geq=dt/Math.max(c.props.l,0.001);
      const Vsrc=-(c.props.iprev||0)*Math.max(c.props.l,0.001)/dt;
      const u=gidOf(pinKey(c.id,'a')), v=gidOf(pinKey(c.id,'b'));
      c.props.iprev = branchCurrent(u,v,Geq,Vsrc);
    }
  });
  // update relay coil current for next frame's contact decision
  comps.forEach(c=>{
    if(c.type==='relay'){
      const u=gidOf(pinKey(c.id,'coilA')), v=gidOf(pinKey(c.id,'coilB'));
      c.props.coilCurrentPrev = branchCurrent(u,v,1/400,0);
    }
  });
  // update 555
  comps.forEach(c=>{
    if(c.type==='timer555'){
      c.props.vccLast=V[gidOf(pinKey(c.id,'vcc'))]; c.props.gndLast=V[gidOf(pinKey(c.id,'gnd'))];
      const R1=c.props.r1, R2=c.props.r2, C=0.00002;
      const tHigh=0.693*(R1+R2)*C, tLow=0.693*R2*C;
      c.props.tAcc += dt;
      if(c.props.state555 && c.props.tAcc>tHigh){ c.props.state555=false; c.props.tAcc=0; }
      else if(!c.props.state555 && c.props.tAcc>tLow){ c.props.state555=true; c.props.tAcc=0; }
    }
  });

  // led results
  const ledResults = comps.filter(c=>c.type==='led').map(c=>{
    if(c.props.burnt) return {c, on:false, brightness:0, current:0, burnt:true};
    const li = ledInfo.find(l=>l.c===c);
    if(!li) return {c,on:false,brightness:0,current:0,burnt:false};
    const cur = li.on ? Math.max(0,(V[li.u]-V[li.v]-LED_COLORS[c.props.colorIdx].vf)/li.ron) : 0;
    if(cur>0.06){ burnOut(c, '\uD83D\uDCA5 LED burned out \u2014 too much current flowed through it. Every LED needs its own resistor in series to limit current, even if there\u2019s already a resistor elsewhere in the circuit. Delete it and add a fresh LED with its own resistor.'); }
    const brightness = Math.min(1, cur/0.02);
    return {c, on: li.on && cur>0.0005, brightness, current:cur, burnt:c.props.burnt};
  });
  // generic diode / bridge current + overcurrent guard
  diodeInfo.forEach(d=>{
    const cur = d.on ? Math.max(0,(V[d.u]-V[d.v]-d.vf)/d.ron) : 0;
    d.c._current = cur;
    if(cur>2.0){ burnOut(d.c, '\uD83D\uDCA5 Diode burned out \u2014 too much current flowed through it. Add a resistor in series to limit the current, or check for a short circuit.'); }
  });
  comps.filter(c=>c.type==='bridge' && !c.props.burnt).forEach(c=>{
    const parts = bridgeInfo.filter(d=>d.c===c);
    const maxCur = Math.max(...parts.map(d=> d.on? Math.max(0,(V[d.u]-V[d.v]-d.vf)/d.ron) : 0));
    c._current = maxCur;
    if(maxCur>2.0){ burnOut(c, '\uD83D\uDCA5 Bridge rectifier burned out \u2014 too much current on its output. Add a resistor (or a bigger capacitor slowly, not all at once) to limit the current, or check for a short circuit.'); }
  });

  // battery total current (leaving positive terminal)
  let totalCurrent=0;
  const transBranches=[];
  transInfo.forEach(t=>{
    transBranches.push(t.on? {u:t.ub,v:t.ue,G:1/RonBE,Vsrc:VBE} : {u:t.ub,v:t.ue,G:1e-9,Vsrc:0});
    transBranches.push(t.on? {u:t.uc,v:t.ue,G:1/RonCE,Vsrc:0} : {u:t.uc,v:t.ue,G:1e-9,Vsrc:0});
  });
  const mosfetBranches = mosfetInfo.map(m=> m.on? {u:m.ud,v:m.us,G:1/RonDS,Vsrc:0} : {u:m.ud,v:m.us,G:1e-9,Vsrc:0});
  const diodeLikeBranches = diodeLike.filter(d=>d.on).map(d=>({u:d.u,v:d.v,G:1/d.ron,Vsrc:d.vf}));
  comps.filter(c=>c.type==='battery').forEach(bc=>{
    const gP=gidOf(pinKey(bc.id,'pos'));
    let sum=0;
    branches.concat(diodeLikeBranches).concat(transBranches).concat(mosfetBranches).forEach(br=>{
      if(br.u===gP) sum += branchCurrent(br.u,br.v,br.G,br.Vsrc);
      else if(br.v===gP) sum -= branchCurrent(br.u,br.v,br.G,br.Vsrc);
    });
    totalCurrent += Math.abs(sum);
  });
  // per-wire current sign for animation
  branches.forEach(br=>{ br.ref._current = branchCurrent(br.u,br.v,br.G,br.Vsrc); });

  // buzzer / motor: track current for feedback, guard against overcurrent
  comps.filter(c=>c.type==='buzzer' && !c.props.burnt).forEach(c=>{
    const cur = Math.abs(c._current||0);
    c._buzzCurrent = cur;
    if(cur>0.25){ burnOut(c, '\uD83D\uDCA5 Buzzer burned out \u2014 too much current flowed through it. Add a resistor in series to limit the current, or check for a short circuit.'); }
  });
  comps.filter(c=>c.type==='motor' && !c.props.burnt).forEach(c=>{
    const cur = Math.abs(c._current||0);
    c._motorCurrent = cur;
    if(cur>0.5){ burnOut(c, '\uD83D\uDCA5 Motor burned out \u2014 too much current flowed through it. Add a resistor in series to limit the current, or check for a short circuit.'); }
  });

  const shortCircuit = totalCurrent>1.6;
  return {ledResults, totalCurrent, shortCircuit, gidOf, V, branches, transInfo, mosfetInfo, diodeInfo, bridgeInfo};
}

/* ---------------- visuals update ---------------- */
function updateVisuals(sim){
  if(!sim || !sim.ledResults){ return; }
  sim.ledResults.forEach(r=>{
    const c=r.c; if(!c._domEls) return;
    if(r.burnt){
      c._domEls.root.classList.add('burnt'); c._domEls.glow.style.opacity=0;
    } else {
      c._domEls.root.classList.remove('burnt');
      c._domEls.glow.style.opacity = r.on? (0.25+r.brightness*0.65) : 0;
      c._domEls.dome.style.boxShadow = r.on? '0 0 '+(6+r.brightness*22)+'px '+(4+r.brightness*10)+'px '+LED_COLORS[c.props.colorIdx].hex+', inset -4px -6px 8px rgba(0,0,0,.3)' : '';
    }
  });
  state.components.forEach(c=>{
    if(c.type==='cap' && c._domEls){
      const frac = Math.max(0,Math.min(1, Math.abs(c.props.vprev)/9));
      c._domEls.fill.style.width=(frac*100)+'%';
    }
    if(c.type==='timer555' && c._domEls){
      c._domEls.indicator.style.background = c.props.state555? '#c8ff7a':'#2a1414';
      c._domEls.indicator.style.boxShadow = c.props.state555? '0 0 6px 2px #c8ff7a':'none';
    }
    if(c.type==='transistor' && c._domEls){
      c._domEls.root.classList.toggle('on', !!c.props.on);
    }
    if(c.type==='buzzer' && c._domEls){
      const cur = c._buzzCurrent||0;
      const active = !c.props.burnt && cur>0.001;
      c._domEls.root.classList.toggle('burnt', !!c.props.burnt);
      c._domEls.w1.style.opacity = active? 0.7 : 0;
      c._domEls.w2.style.opacity = active? 0.4 : 0;
      setBuzzerTone(c, active, cur);
    }
    if(c.type==='mosfet' && c._domEls){
      c._domEls.root.classList.toggle('on', !!c.props.on);
    }
    if(c.type==='relay' && c._domEls){
      c._domEls.root.classList.toggle('closed', !!c.props.closed);
    }
    if((c.type==='diode'||c.type==='bridge') && c._domEls){
      c._domEls.root.classList.toggle('burnt', !!c.props.burnt);
    }
    if(c.type==='motor' && c._domEls){
      const cur = Math.abs(c._motorCurrent||0);
      c._domEls.root.classList.toggle('burnt', !!c.props.burnt);
      if(!c._spinAngle) c._spinAngle=0;
      c._spinAngle += Math.min(40, cur*900);
      c._domEls.rotor.style.transform = 'rotate('+c._spinAngle+'deg)';
    }
  });
  // wire flow animation
  state.wires.forEach(w=>{
    const [cid]=w.a.split(':');
    const c=state.components.find(x=>x.id===cid);
    let cur=0;
    if(c){
      const near = state.components.find(x=> x.type!=='led' && (x._current!==undefined));
    }
    w._flow.style.opacity = sim.totalCurrent>0.0008 ? Math.min(0.9,0.25+sim.totalCurrent*8) : 0;
    if(!w._dashOffset) w._dashOffset=0;
    w._dashOffset -= (sim.totalCurrent>0?1:0)*(1+sim.totalCurrent*30);
    w._flow.setAttribute('stroke-dashoffset', w._dashOffset);
  });
  if(board.classList.contains('short')===false && sim.shortCircuit){
    board.classList.add('short'); buzz(); toast('⚡ Short circuit — add a resistor to limit the current.');
    setTimeout(()=>board.classList.remove('short'),700);
  }
  setHum(sim.totalCurrent);
}

/* ---------------- goal tracking ---------------- */
function ledIsLit(comp, sim){
  const r = sim.ledResults.find(x=>x.c===comp);
  return !!(r && r.on && !r.burnt);
}
function treeHasLitLed(node, sim){
  if(!node) return false;
  if(node.type==='leaf') return node.kind==='led' && ledIsLit(node.comp, sim);
  return node.children.some(ch=>treeHasLitLed(ch.node, sim));
}
function findParallelLit(node, sim){
  if(!node) return false;
  if(node.type==='parallel'){
    const litBranches = node.children.filter(ch=>treeHasLitLed(ch.node, sim)).length;
    if(litBranches>=2) return true;
  }
  const kids = node.children||[];
  return kids.some(ch=>findParallelLit(ch.node, sim));
}
function flattenSeries(node, flip){
  if(!node) return [];
  if(node.type==='leaf') return [{kind:node.kind, comp:node.comp}];
  if(node.type==='series'){
    const kids = flip? [...node.children].reverse() : node.children;
    let out=[];
    kids.forEach(ch=>{ const cf = flip? !ch.flip : ch.flip; out = out.concat(flattenSeries(ch.node, cf)); });
    return out;
  }
  return [{kind:'__parallel__', comp:null}];
}
function findSeriesLitPair(node, sim){
  if(!node) return false;
  if(node.type==='series'){
    const flat = flattenSeries(node, false);
    for(let i=0;i<flat.length-1;i++){
      if(flat[i].kind==='led' && flat[i+1].kind==='led' && ledIsLit(flat[i].comp,sim) && ledIsLit(flat[i+1].comp,sim)) return true;
    }
  }
  const kids = node.children||[];
  return kids.some(ch=>findSeriesLitPair(ch.node, sim));
}
function detectTopology(sim){
  const schem = buildSchematicTree();
  if(!schem || !schem.tree) return {seriesPairFound:false, parallelPairFound:false};
  return {
    seriesPairFound: findSeriesLitPair(schem.tree, sim),
    parallelPairFound: findParallelLit(schem.tree, sim)
  };
}

let winShown=false;
function trackToggleDemo(comp, seenOnKey, seenOffAfterKey){
  if(!comp) return false;
  if(comp.props.on){ state[seenOnKey]=true; }
  if(state[seenOnKey] && !comp.props.on){ state[seenOffAfterKey]=true; }
  return !!state[seenOffAfterKey];
}
function checkGoal(sim){
  const lvl=LEVELS[state.level-1];
  const topo=detectTopology(sim);
  const buzzerActive = state.components.some(c=>c.type==='buzzer' && !c.props.burnt && (c._buzzCurrent||0)>0.001);
  const transistor = state.components.find(c=>c.type==='transistor');
  const mosfet = state.components.find(c=>c.type==='mosfet');
  const relay = state.components.find(c=>c.type==='relay');
  const ldr = state.components.find(c=>c.type==='ldr');
  const anyLedOn = sim.ledResults.some(r=>r.on && !r.burnt);
  const transistorOn = !!(transistor && transistor.props.on);
  const transistorSwitchDemo = trackToggleDemo(transistor, 'transSeenOnEver', 'transSeenOffAfterOn');
  const mosfetSwitchDemo = trackToggleDemo(mosfet, 'mosfetSeenOnEver', 'mosfetSeenOffAfterOn');

  const acBattery = state.components.find(c=>c.type==='battery' && BATTERY_TYPES[c.props.typeIdx].id==='AC');
  if(acBattery && anyLedOn) state.acLedSeenLit=true;

  const solarBattery = state.components.find(c=>c.type==='battery' && BATTERY_TYPES[c.props.typeIdx].id==='SOLAR');
  if(solarBattery && anyLedOn) state.solarLedOn=true;

  if(anyLedOn) state.continuousLitSeconds=(state.continuousLitSeconds||0)+state.lastDt;
  else state.continuousLitSeconds=0;
  if(state.continuousLitSeconds>=3) state.smoothingAchieved=true;
  const activeCap = state.components.find(c=>c.type==='cap' && !c.props.burnt);
  const capTypeGood = !!(activeCap && (CAP_TYPES[activeCap.props.typeIdx].id==='ELECTRO' || CAP_TYPES[activeCap.props.typeIdx].id==='SUPERCAP'));
  if(state.smoothingAchieved && capTypeGood) state.rightCapTypeSmoothing=true;

  const ledBright = sim.ledResults.length ? Math.max(...sim.ledResults.map(r=>r.brightness)) : 0;
  const hasInductor = state.components.some(c=>c.type==='inductor');
  if(hasInductor){
    if(ledBright>0.05 && ledBright<0.85) state.rampPartialSeconds=(state.rampPartialSeconds||0)+state.lastDt;
    if(state.rampPartialSeconds>0.12 && ledBright>0.8) state.inductorRampSeen=true;
  }

  if(relay && relay.props.closed && anyLedOn) state.relayLoadOn=true;
  if(state.wires.some(w=>w.points && w.points.length>0)) state.viaUsed=true;

  const s={
    leds: sim.ledResults.map(r=>({on:r.on,burnt:r.burnt,brightness:r.brightness})),
    seriesPairFound:topo.seriesPairFound, parallelPairFound:topo.parallelPairFound,
    blinkSeconds: state.blinkTimer,
    timerBlinks: state.blinkFlips>=6,
    afterglowAchieved: state.afterglowAchieved,
    buzzerActive,
    transistorSwitchDemo,
    mosfetSwitchDemo,
    nightLightOn: !!(anyLedOn && transistorOn && ldr && ldr.props.light<35),
    alarmOn: !!(buzzerActive && transistorOn && ldr && ldr.props.light<35),
    acLedSeenLit: !!state.acLedSeenLit,
    smoothingAchieved: !!state.smoothingAchieved,
    rightCapTypeSmoothing: !!state.rightCapTypeSmoothing,
    inductorRampSeen: !!state.inductorRampSeen,
    relayLoadOn: !!state.relayLoadOn,
    solarLedOn: !!state.solarLedOn,
    viaUsed: !!state.viaUsed,
  };
  const done = lvl.check(s);
  const statusEl=document.getElementById('status');
  if(done){
    statusEl.className='win';
    statusEl.textContent='✓ Goal met! '+(state.level<LEVELS.length? 'Next project unlocked.':'You have completed every project.');
    if(!winShown){
      winShown=true;
      if(state.level===state.unlocked && state.level<LEVELS.length){
        state.unlocked=state.level+1;
        localStorage.setItem('cl_unlocked', JSON.stringify(state.unlocked));
      }
      chime(); renderLevelTrack();
    }
  } else {
    statusEl.className=''; winShown=false;
    statusEl.textContent='Not yet — '+lvl.goal;
  }
  document.getElementById('readout').innerHTML =
    '<b>Battery current:</b> '+(sim.totalCurrent*1000).toFixed(1)+' mA<br>'+
    '<b>LEDs lit:</b> '+s.leds.filter(l=>l.on&&!l.burnt).length+' / '+s.leds.length+
    (state.level===5 ? '<br><b>Afterglow so far:</b> '+state.afterglowSeconds.toFixed(2)+'s'+(state.afterglowAchieved?' \u2713':'') : '')+
    (state.level===8 ? '<br><b>Buzzer:</b> '+(s.buzzerActive?'sounding \u2713':'silent') : '')+
    (state.level===9 ? '<br><b>Transistor:</b> '+(transistorOn?'on':'off')+(s.transistorSwitchDemo?' \u2014 switching confirmed \u2713':'') : '')+
    (state.level===10||state.level===11 ? '<br><b>Photoresistor:</b> '+(ldr?ldr.props.light:'?')+'% light' : '')+
    (state.level===11 ? '<br><b>Alarm:</b> '+(s.alarmOn?'sounding \u2713':'quiet') : '');
}

/* blink tracking for level 5 & 6 */
let lastLedOnAny=false;
function trackBlink(sim, dt){
  const anyOn = sim.ledResults.some(r=>r.on && !r.burnt);
  if(state.level===5){
    const sw = state.components.find(c=>c.type==='switch');
    if(sw && !sw.props.closed && anyOn){
      state.afterglowSeconds += dt;
      if(state.afterglowSeconds>=0.35) state.afterglowAchieved=true;
    } else if(sw && sw.props.closed){
      state.afterglowSeconds = 0;
    }
  }
  if(state.level===6){
    if(anyOn && !lastLedOnAny) state.blinkFlips++;
  }
  lastLedOnAny=anyOn;
}

/* ---------------- main loop ---------------- */
function updatePowerMeter(sim){
  const dot=document.getElementById('pwrDot'), label=document.getElementById('pwrLabel');
  const battery=state.components.find(c=>c.type==='battery');
  const current=(sim&&sim.totalCurrent)||0;
  const on = current>0.0008;
  dot.className = 'dot' + ((sim&&sim.shortCircuit) ? ' short' : (on?' on':''));
  label.textContent = (sim&&sim.shortCircuit) ? 'Short!' : (on?'Power on':(battery?'Power off':'No supply'));
  document.getElementById('pwrVolt').textContent = (battery? battery.props.v:0).toFixed(1);
  document.getElementById('pwrAmp').textContent = (current*1000).toFixed(1);
}
function loop(t){
  const dt=Math.min(0.05,(t-lastT)/1000); lastT=t;
  state.simClock = (state.simClock||0) + dt;
  state.lastDt = dt||0.016;
  updateWireGeometry();
  const sim=simulateStep(dt||0.016);
  if(sim.ledResults){
    updateVisuals(sim);
    trackBlink(sim,dt);
    checkGoal(sim);
  }
  updatePowerMeter(sim);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function restoreBoard(data){

  data.components.forEach(cd=>{

/* ---------------- schematic generator ---------------- */
const SVGNS='http://www.w3.org/2000/svg';
const LEAF_W=118, LEAF_H=70, ROWGAP=22, BUS_PAD=18;

function buildSchematicTree(compsOverride, wiresOverride){
  const comps=compsOverride||state.components, wires=wiresOverride||state.wires;
  const battery = comps.find(c=>c.type==='battery');
  if(!battery) return {error:'Add a battery and complete a loop first — the schematic needs a power source to work from.'};
  const {gidOf} = computeGroups(comps, wires);
  const VCC=gidOf(pinKey(battery.id,'pos')), GND=gidOf(pinKey(battery.id,'neg'));

  let edges=[];
  comps.forEach(c=>{
    if(c===battery) return;
    if(c.type==='timer555'){
      const gVcc=gidOf(pinKey(c.id,'vcc')), gGnd=gidOf(pinKey(c.id,'gnd')), gOut=gidOf(pinKey(c.id,'out'));
      if(gVcc===VCC && gGnd===GND) edges.push({u:VCC, v:gOut, comp:c, kind:'555'});
      return;
    }
    if(c.type==='transistor'){
      edges.push({u:gidOf(pinKey(c.id,'collector')), v:gidOf(pinKey(c.id,'emitter')), comp:c, kind:'transistor'});
      return;
    }
    if(c.type==='mosfet'){
      edges.push({u:gidOf(pinKey(c.id,'drain')), v:gidOf(pinKey(c.id,'source')), comp:c, kind:'mosfet'});
      return;
    }
    if(c.type==='bridge'){
      edges.push({u:gidOf(pinKey(c.id,'ac1')), v:gidOf(pinKey(c.id,'ac2')), comp:c, kind:'bridge'});
      return;
    }
    if(c.type==='relay'){
      edges.push({u:gidOf(pinKey(c.id,'coilA')), v:gidOf(pinKey(c.id,'coilB')), comp:c, kind:'relay-coil'});
      edges.push({u:gidOf(pinKey(c.id,'ctA')), v:gidOf(pinKey(c.id,'ctB')), comp:c, kind:'relay-contact'});
      return;
    }
    const def=COMP_TYPES[c.type], pa=def.pins[0], pb=def.pins[1];
    edges.push({u:gidOf(pinKey(c.id,pa.id)), v:gidOf(pinKey(c.id,pb.id)), comp:c, kind:c.type});
  });
  if(edges.length===0) return {error:'Add a component between the battery terminals to see a schematic.'};

  let nodes = edges.map((e,i)=>({id:'e'+i, u:e.u, v:e.v, tree:{type:'leaf', comp:e.comp, kind:e.kind}}));

  let guard=0;
  while(guard++<200){
    let changed=false;
    // parallel merge
    const groups={};
    nodes.forEach(e=>{
      if(e.u===e.v) return;
      const key = e.u<e.v ? e.u+'_'+e.v : e.v+'_'+e.u;
      (groups[key]=groups[key]||[]).push(e);
    });
    const merged=new Set();
    let newNodes=[];
    Object.values(groups).forEach(g=>{
      if(g.length>1){
        changed=true;
        const a=g[0].u, b=g[0].v;
        const children=g.map(e=> ({node:e.tree, flip: e.u!==a}));
        newNodes.push({id:'p_'+g[0].id, u:a, v:b, tree:{type:'parallel', children}});
        g.forEach(e=>merged.add(e));
      }
    });
    nodes.forEach(e=>{ if(!merged.has(e)) newNodes.push(e); });
    nodes=newNodes;

    if(!changed){
      const deg={};
      nodes.forEach(e=>{ deg[e.u]=(deg[e.u]||0)+1; deg[e.v]=(deg[e.v]||0)+1; });
      outer:
      for(const x of Object.keys(deg)){
        const xi=+x;
        if(xi===VCC || xi===GND) continue;
        if(deg[x]!==2) continue;
        const incident = nodes.filter(e=> e.u===xi || e.v===xi);
        if(incident.length!==2) continue;
        const [e1,e2]=incident;
        if(e1===e2) continue;
        const a = e1.u===xi? e1.v : e1.u;
        const b = e2.u===xi? e2.v : e2.u;
        const childA = {node:e1.tree, flip: e1.u===xi};
        const childB = {node:e2.tree, flip: e2.u!==xi};
        const tree = {type:'series', children:[childA, childB]};
        nodes = nodes.filter(e=> e!==e1 && e!==e2);
        nodes.push({id:'s_'+e1.id+'_'+e2.id, u:a, v:b, tree});
        changed=true;
        break outer;
      }
    }
    if(!changed) break;
  }
  const main = nodes.find(e=> (e.u===VCC&&e.v===GND)||(e.u===GND&&e.v===VCC));
  if(!main) return {error:'This layout is too tangled for an auto schematic — try a simpler loop (one or two branches).'};
  return {tree:main.tree, flip: main.v===VCC, battery};
}

function sizeOfNode(node){
  if(node.type==='leaf') return {w:LEAF_W, h:LEAF_H};
  if(node.type==='series'){

  wrap.innerHTML='';

  if(result.error){
    note.textContent='';
    const d=document.createElement('div'); d.className='empty'; d.textContent=result.error;
    wrap.appendChild(d);
    return;
  }
  const size=sizeOfNode(result.tree);
  const battX=54, gapL=64, gapR=64, marginTop=46, marginBottom=46;
  const totalW = battX+gapL+size.w+gapR+30;
  const totalH = Math.max(size.h, 90)+marginTop+marginBottom;
  const svg=svgEl('svg',{width:totalW,height:totalH,viewBox:`0 0 ${totalW} ${totalH}`});
  const labels=svgEl('g',{});

  const battTop=treeCenterY-size.h/2-24, battH=size.h+48;

  leadLine(svg, treeX, battTop, treeX, treeCenterY);
  // bottom rail: tree right terminal -> battery -
  const rx=treeX+size.w;
  leadLine(svg, rx, treeCenterY, rx, battTop+battH);
  leadLine(svg, rx, battTop+battH, battX, battTop+battH);
  drawBattery(svg,labels,battX,battTop,battH,result.battery.props.v);

  svg.appendChild(labels);
  wrap.appendChild(svg);
  note.textContent = solution
    ? 'One valid solution for this project — yours can look different and still work.'
    : 'Auto-generated from your wiring — a best-effort redraw, not a trace of the board layout.';
  window._lastSchemSvg=svg;
}

function buildExportSVG(){
  const W=900, H=520;
  const svg=svgEl('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`,xmlns:'http://www.w3.org/2000/svg'});
  svg.appendChild(svgEl('rect',{x:0,y:0,width:W,height:H,fill:'#0d3d2f'}));
  const grid=svgEl('g',{opacity:0.25});
  for(let x=14;x<W;x+=24) for(let y=14;y<H;y+=24) grid.appendChild(svgEl('circle',{cx:x,cy:y,r:1.3,fill:'#ffd78c'}));
  svg.appendChild(grid);
  state.wires.forEach(w=>{
    const pa=pinPos(w.a), pb=pinPos(w.b);
    if(!pa||!pb) return;
    const pts=routePoints(pa,pb,w.points);
    svg.appendChild(svgEl('polyline',{points:pointsAttr(pts), fill:'none', stroke:'#e8b45a', 'stroke-width':5, 'stroke-linecap':'round','stroke-linejoin':'round'}));
    (w.points||[]).forEach(p=>{
      svg.appendChild(svgEl('circle',{cx:p.x,cy:p.y,r:6,fill:'#0d3d2f',stroke:'#4d9dff','stroke-width':2.5}));
    });
  });
  state.components.forEach(c=>{
    const def=COMP_TYPES[c.type];
    svg.appendChild(svgEl('rect',{x:c.x,y:c.y,width:def.w,height:def.h,rx:5,fill:'rgba(255,255,255,.07)',stroke:'#8a95a3','stroke-width':1}));
    const label=svgEl('text',{x:c.x+def.w/2,y:c.y+def.h/2+4,'text-anchor':'middle','font-family':"'Space Grotesk',sans-serif",'font-size':10,fill:'#cfe8dc'});
    label.textContent=PART_META[c.type].label; svg.appendChild(label);
    const tag=svgEl('text',{x:c.x+def.w/2,y:c.y+def.h+13,'text-anchor':'middle','font-family':"'Inter',sans-serif",'font-size':9,fill:'#9fd9c0'});
    tag.textContent=tagText(c); svg.appendChild(tag);
    def.pins.forEach(p=>{
      svg.appendChild(svgEl('circle',{cx:c.x+p.dx,cy:c.y+p.dy,r:4.5,fill:'#d8b465',stroke:'#8a6620','stroke-width':1.2}));
    });
  });
  const title=svgEl('text',{x:16,y:24,'font-family':"'Space Grotesk',sans-serif",'font-size':14,fill:'#e8f5ee','font-weight':700});
  title.textContent='Circuit Lab 2.0 \u2014 PCB design export'; svg.appendChild(title);
  return svg;
}
function buildNetlistText(){
  const lines=['CIRCUIT LAB 2.0 \u2014 DESIGN EXPORT','This is a reference design for study or hand-off to a PCB CAD tool \u2014 not a certified fabrication (Gerber) file.','',
    'COMPONENTS ('+state.components.length+'):'];
  state.components.forEach(c=>{ lines.push('  '+c.id+':  '+PART_META[c.type].label+'  \u2014  '+tagText(c)); });
  lines.push('', 'CONNECTIONS ('+state.wires.length+'):');
  state.wires.forEach(w=>{
    const viaNote = (w.points && w.points.length) ? '   [via x'+w.points.length+']' : '';
    lines.push('  '+w.a+'   <-->   '+w.b+viaNote);
  });
  return lines.join('\n');
}
function downloadBlob(filename, content, mime){
  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
document.getElementById('exportBtn').onclick=()=>{
  if(state.components.length===0){ toast('Build a circuit first \u2014 nothing to export yet.'); return; }
  const svg=buildExportSVG();
  const svgXml=new XMLSerializer().serializeToString(svg);
  downloadBlob('circuit-lab-pcb-design.svg', '<?xml version="1.0" standalone="no"?>\n'+svgXml, 'image/svg+xml');
  downloadBlob('circuit-lab-netlist.txt', buildNetlistText(), 'text/plain');
  toast('Design exported: board SVG + netlist. Reference files for study or CAD hand-off, not a fab-ready Gerber.');
  blip(950,0.08,'triangle',0.12);
};

  const xml=new XMLSerializer().serializeToString(svg);
  const blob=new Blob(['<?xml version="1.0" standalone="no"?>\n'+xml],{type:'image/svg+xml'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='schematic-level'+state.level+'.svg';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
};
